<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 760 412" width="760" height="412" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e293b" flood-opacity=".14"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ไล่ลูปของ ParallelCircuit ด้วยแผง Variables</text><style>
  @keyframes s1{0%,12%{opacity:0;transform:translateY(-8px)}18%,100%{opacity:1;transform:none}}
  @keyframes s2{0%,40%{opacity:0;transform:translateY(-8px)}46%,100%{opacity:1;transform:none}}
  @keyframes over{0%,40%{opacity:1}46%,100%{opacity:.25}}
  @keyframes res{0%,62%{opacity:0;transform:scale(.6)}68%{opacity:1;transform:scale(1.1)}72%,100%{opacity:1;transform:scale(1)}}
  @keyframes hl{0%,10%{opacity:0}12%,36%{opacity:1}38%,40%{opacity:0}42%,60%{opacity:1}62%,100%{opacity:0}}
  .s1{animation:s1 8s infinite}.s2{animation:s2 8s infinite}.over{animation:over 8s infinite}
  .res{transform-box:fill-box;transform-origin:center;animation:res 8s infinite}.hl{animation:hl 8s infinite}
  @media (prefers-reduced-motion:reduce),print{*{animation:none!important}.over{opacity:.25}}</style><rect x="30" y="62" width="700" height="146" rx="12" fill="#fff1f2" stroke="#fecdd3"/><text x="50" y="90" font-size="15" font-weight="bold" fill="#be123c">ใช้  =  (บั๊ก)</text><rect x="50" y="102" width="300" height="30" rx="6" fill="#0f172a"/><rect class="hl" x="50" y="102" width="300" height="30" rx="6" fill="none" stroke="#facc15" stroke-width="2.5"/><text x="62" y="122" font-size="13" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#e2e8f0">sumOfInverse <tspan fill="#fb7185" font-weight="bold">=</tspan> 1 / part.resistance();</text><text x="50" y="160" font-size="13" fill="#475569">รอบ 1  part = R2 (200 Ω)</text><text x="50" y="186" font-size="13" fill="#475569">รอบ 2  part = R3 (300 Ω)</text><text x="240" y="160" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">+ 0.005</text><text x="240" y="186" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">+ 0.003333</text><g class="s1"><rect x="400" y="144" width="130" height="24" rx="6" fill="#ffffff" stroke="#fda4af"/><text x="465" y="161" text-anchor="middle" font-size="13" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" class="over">sum = 0.005</text></g><g class="s2"><rect x="400" y="172" width="130" height="24" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="2"/><text x="465" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#be123c" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">sum = 0.003333</text></g><g class="s2"><text x="540" y="189" font-size="12.5" font-weight="bold" fill="#be123c">← ค่ารอบแรกหายไป</text></g><g class="res"><rect x="590" y="102" width="124" height="54" rx="10" fill="#e11d48"/><text x="652" y="124" text-anchor="middle" font-size="12" fill="#ffe4e6" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">1 / sum</text><text x="652" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">= 300 Ω ✗</text></g><rect x="30" y="222" width="700" height="146" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/><text x="50" y="250" font-size="15" font-weight="bold" fill="#15803d">ใช้  +=  (ถูกต้อง)</text><rect x="50" y="262" width="300" height="30" rx="6" fill="#0f172a"/><rect class="hl" x="50" y="262" width="300" height="30" rx="6" fill="none" stroke="#facc15" stroke-width="2.5"/><text x="62" y="282" font-size="13" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#e2e8f0">sumOfInverse <tspan fill="#4ade80" font-weight="bold">+=</tspan> 1 / part.resistance();</text><text x="50" y="320" font-size="13" fill="#475569">รอบ 1  part = R2 (200 Ω)</text><text x="50" y="346" font-size="13" fill="#475569">รอบ 2  part = R3 (300 Ω)</text><text x="240" y="320" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">+ 0.005</text><text x="240" y="346" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">+ 0.003333</text><g class="s1"><rect x="400" y="304" width="130" height="24" rx="6" fill="#ffffff" stroke="#86efac"/><text x="465" y="321" text-anchor="middle" font-size="13" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">sum = 0.005</text></g><g class="s2"><rect x="400" y="332" width="130" height="24" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="465" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">sum = 0.008333</text></g><g class="s2"><text x="540" y="349" font-size="12.5" font-weight="bold" fill="#15803d">← บวกสะสม</text></g><g class="res"><rect x="590" y="262" width="124" height="54" rx="10" fill="#16a34a"/><text x="652" y="284" text-anchor="middle" font-size="12" fill="#dcfce7" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">1 / sum</text><text x="652" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">= 120 Ω ✓</text></g><text x="380" y="396" text-anchor="middle" font-size="12.5" fill="#64748b">กรอบสีเหลืองคือบรรทัดที่ debugger หยุดอยู่ · ตัวเลขในกล่องคือค่า sumOfInverse ในแผง Variables หลังทำบรรทัดนั้น</text>
</svg>
