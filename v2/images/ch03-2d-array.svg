<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="อาร์เรย์สองมิติ matrix2 มองเป็นตาราง 3 แถว 4 คอลัมน์ และเบื้องหลังคืออาร์เรย์ของอาร์เรย์">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <g style="font-variant-ligatures:none" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="390" y="36" font-size="22" font-weight="bold" text-anchor="middle">อาร์เรย์สองมิติ: มองเป็นตาราง แต่เบื้องหลังคืออาร์เรย์ซ้อนอาร์เรย์</text>

    <!-- left: grid view -->
    <text x="210" y="70" font-size="16" font-weight="bold" text-anchor="middle">มุมมองตาราง</text>
    <text x="210" y="94" font-size="14" text-anchor="middle" fill="#4b5563">คอลัมน์ (col)</text>
    <g font-size="14" text-anchor="middle" fill="#4b5563" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="120" y="116">[0]</text><text x="180" y="116">[1]</text><text x="240" y="116" fill="#2563eb" font-weight="bold">[2]</text><text x="300" y="116">[3]</text>
      <text x="68" y="150">[0]</text><text x="68" y="200" fill="#2563eb" font-weight="bold">[1]</text><text x="68" y="250">[2]</text>
    </g>
    <text x="34" y="200" font-size="14" text-anchor="middle" fill="#4b5563" transform="rotate(-90 34 200)">แถว (row)</text>
    <rect x="90" y="175" width="240" height="50" fill="#dbeafe"/>
    <g stroke="#9ca3af" stroke-width="2" fill="none">
      <rect x="90" y="125" width="240" height="150"/>
      <line x1="150" y1="125" x2="150" y2="275"/><line x1="210" y1="125" x2="210" y2="275"/><line x1="270" y1="125" x2="270" y2="275"/>
      <line x1="90" y1="175" x2="330" y2="175"/><line x1="90" y1="225" x2="330" y2="225"/>
    </g>
    <rect x="210" y="175" width="60" height="50" fill="#2563eb"/>
    <g font-size="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="120" y="156">1</text><text x="180" y="156">2</text><text x="240" y="156">3</text><text x="300" y="156">4</text>
      <text x="120" y="206">5</text><text x="180" y="206">6</text><text x="240" y="206" fill="#ffffff" font-weight="bold">7</text><text x="300" y="206">8</text>
      <text x="120" y="256">9</text><text x="180" y="256">10</text><text x="240" y="256">11</text><text x="300" y="256">12</text>
    </g>
    <text x="210" y="312" font-size="17" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#2563eb" font-weight="bold">matrix2[1][2] = 7</text>
    <text x="210" y="338" font-size="15" text-anchor="middle" fill="#4b5563">วงเล็บแรกคือแถว วงเล็บที่สองคือคอลัมน์</text>

    <line x1="380" y1="60" x2="380" y2="370" stroke="#e5e7eb" stroke-width="2"/>

    <!-- right: array of arrays -->
    <text x="580" y="70" font-size="16" font-weight="bold" text-anchor="middle">เบื้องหลังในหน่วยความจำ</text>
    <rect x="400" y="170" width="90" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="445" y="196" font-size="15" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">matrix2</text>
    <line x1="490" y1="190" x2="514" y2="190" stroke="#4b5563" stroke-width="2" marker-end="url(#m2)"/>

    <g stroke="#9ca3af" stroke-width="2" fill="#f9fafb">
      <rect x="518" y="130" width="44" height="40"/>
      <rect x="518" y="170" width="44" height="40" fill="#dbeafe"/>
      <rect x="518" y="210" width="44" height="40"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#4b5563" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="540" y="122">[0..2]</text>
    </g>
    <circle cx="540" cy="150" r="4" fill="#4b5563"/><circle cx="540" cy="190" r="4" fill="#2563eb"/><circle cx="540" cy="230" r="4" fill="#4b5563"/>
    <line x1="540" y1="150" x2="610" y2="118" stroke="#4b5563" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="540" y1="190" x2="610" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="540" y1="230" x2="610" y2="262" stroke="#4b5563" stroke-width="2" marker-end="url(#m2)"/>

    <g stroke="#9ca3af" stroke-width="2" fill="#f9fafb">
      <rect x="614" y="100" width="36" height="36"/><rect x="650" y="100" width="36" height="36"/><rect x="686" y="100" width="36" height="36"/><rect x="722" y="100" width="36" height="36"/>
      <rect x="614" y="172" width="36" height="36"/><rect x="650" y="172" width="36" height="36"/><rect x="686" y="172" width="36" height="36" fill="#2563eb" stroke="#2563eb"/><rect x="722" y="172" width="36" height="36"/>
      <rect x="614" y="244" width="36" height="36"/><rect x="650" y="244" width="36" height="36"/><rect x="686" y="244" width="36" height="36"/><rect x="722" y="244" width="36" height="36"/>
    </g>
    <g font-size="15" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="632" y="123">1</text><text x="668" y="123">2</text><text x="704" y="123">3</text><text x="740" y="123">4</text>
      <text x="632" y="195">5</text><text x="668" y="195">6</text><text x="704" y="195" fill="#ffffff" font-weight="bold">7</text><text x="740" y="195">8</text>
      <text x="632" y="267">9</text><text x="668" y="267">10</text><text x="704" y="267">11</text><text x="740" y="267">12</text>
    </g>
    <g font-size="14" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="400" y="312">matrix2.length = 3</text>
      <text x="400" y="338">matrix2[1].length = 4</text>
    </g>
    <g font-size="14" fill="#4b5563">
      <text x="590" y="312">จำนวนแถว</text>
      <text x="610" y="338">ความยาวแถวที่ 1</text>
    </g>
  </g>
</svg>
