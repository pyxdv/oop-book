<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="เทียบก่อนและหลังการห่อหุ้ม แอตทริบิวต์ public รับค่าติดลบได้ ส่วน private กับ deposit ปฏิเสธค่าติดลบ">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <g font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="400" y="38" font-size="22" font-weight="700" text-anchor="middle">ก่อนและหลังห่อหุ้ม: ใส่ค่าติดลบให้ยอดเงิน</text>

    <!-- ซ้าย -->
    <rect x="20" y="60" width="370" height="370" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#dc2626">✗ ก่อน: แอตทริบิวต์เป็น public</text>
    <rect x="40" y="108" width="330" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="134" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14">public double balance;</text>
    <text x="40" y="180" font-size="15">โค้ดที่ไหนก็เขียนแบบนี้ได้</text>
    <rect x="40" y="192" width="330" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="218" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14">acc.balance = -99999;</text>
    <line x1="205" y1="232" x2="205" y2="282" stroke="#4b5563" stroke-width="2" marker-end="url(#g)"/>
    <text x="215" y="262" font-size="14" fill="#4b5563">เข้าไปตรง ๆ ไม่มีด่านตรวจ</text>
    <rect x="60" y="286" width="290" height="50" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="205" y="317" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" text-anchor="middle" fill="#dc2626">balance = -99999.0</text>
    <text x="40" y="372" font-size="15">ข้อมูลพังเงียบ ๆ ไม่มี error</text>
    <text x="40" y="398" font-size="15">ต้องไล่หาว่าบรรทัดไหนเป็นคนแก้</text>

    <!-- ขวา -->
    <rect x="410" y="60" width="370" height="370" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="595" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#059669">✓ หลัง: private + ตรวจค่า</text>
    <rect x="430" y="108" width="330" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="444" y="134" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14">private double balance;</text>
    <text x="430" y="180" font-size="15">ต้องผ่านเมธอดเท่านั้น</text>
    <rect x="430" y="192" width="330" height="40" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="444" y="218" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14">acc.deposit(-99999);</text>
    <line x1="595" y1="232" x2="595" y2="252" stroke="#4b5563" stroke-width="2" marker-end="url(#g)"/>
    <rect x="490" y="254" width="210" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="595" y="278" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" text-anchor="middle">amount &gt; 0 ? ไม่ใช่</text>
    <line x1="595" y1="290" x2="595" y2="306" stroke="#4b5563" stroke-width="2" marker-end="url(#g)"/>
    <rect x="450" y="308" width="290" height="44" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="595" y="336" font-size="15" text-anchor="middle" fill="#059669">ปฏิเสธ balance ยังเท่าเดิม</text>
    <text x="430" y="384" font-size="15">ถ้าแอบเขียน acc.balance = -99999;</text>
    <text x="430" y="408" font-size="15" fill="#059669" font-weight="700">คอมไพล์ไม่ผ่านตั้งแต่แรก</text>
  </g>
</svg>
