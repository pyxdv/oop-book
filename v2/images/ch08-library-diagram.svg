<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" width="780" height="720" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">แผนภาพคลาสของระบบห้องสมุด</text>

  <g fill="#ffffff" stroke="#1f2937" stroke-width="2">
    <rect x="260" y="60" width="260" height="160"/>
    <rect x="60" y="290" width="280" height="136"/>
    <rect x="440" y="290" width="280" height="136"/>
    <rect x="60" y="520" width="280" height="160"/>
  </g>
  <!-- แถบชื่อคลาส -->
  <g fill="#dbeafe">
    <rect x="261" y="61" width="258" height="39"/>
    <rect x="61" y="291" width="278" height="39"/>
    <rect x="441" y="291" width="278" height="39"/>
    <rect x="61" y="521" width="278" height="39"/>
  </g>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="260" y1="100" x2="520" y2="100"/><line x1="260" y1="160" x2="520" y2="160"/>
    <line x1="60" y1="330" x2="340" y2="330"/><line x1="60" y1="366" x2="340" y2="366"/>
    <line x1="440" y1="330" x2="720" y2="330"/><line x1="440" y1="366" x2="720" y2="366"/>
    <line x1="60" y1="560" x2="340" y2="560"/><line x1="60" y1="644" x2="340" y2="644"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="390" y="87">Person</text>
    <text x="200" y="317">Member</text>
    <text x="580" y="317">Librarian</text>
    <text x="200" y="547">Book</text>
  </g>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">
    <text x="272" y="125">- name : String</text>
    <text x="272" y="149">- id : String</text>
    <text x="272" y="185">+ getName() : String</text>
    <text x="272" y="209">+ setName(name : String)</text>

    <text x="72" y="354">- memberCard : int</text>
    <text x="72" y="390">+ borrowBook(b : Book)</text>
    <text x="72" y="414">+ returnBook(b : Book)</text>

    <text x="452" y="354">- employeeId : String</text>
    <text x="452" y="390">+ addBook(b : Book)</text>
    <text x="452" y="414">+ removeBook(b : Book)</text>

    <text x="72" y="584">- isbn : String</text>
    <text x="72" y="608">- title : String</text>
    <text x="72" y="632">- author : String</text>
    <text x="72" y="668">+ getInfo() : String</text>
  </g>

  <!-- Generalization แบบต้นไม้: สามเหลี่ยมโปร่งอันเดียวที่คลาสแม่ -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <line x1="390" y1="238" x2="390" y2="260"/>
    <line x1="200" y1="260" x2="580" y2="260"/>
    <line x1="200" y1="260" x2="200" y2="290"/>
    <line x1="580" y1="260" x2="580" y2="290"/>
  </g>
  <polygon points="390,220 380,238 400,238" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="410" y="250" font-size="15" fill="#4b5563">Member และ Librarian เป็น Person</text>

  <!-- Association: Member * borrows * Book -->
  <line x1="200" y1="426" x2="200" y2="520" stroke="#1f2937" stroke-width="2"/>
  <text x="210" y="448" font-size="18" font-weight="bold" fill="#d97706">*</text>
  <text x="210" y="514" font-size="18" font-weight="bold" fill="#d97706">*</text>
  <text x="222" y="480" font-size="16" fill="#4b5563">borrows ▾</text>

  <!-- คำอธิบายด้านขวา -->
  <g font-size="15" fill="#1f2937">
    <text x="400" y="520">สมาชิก 1 คน ยืมหนังสือได้หลายเล่ม</text>
    <text x="400" y="544">หนังสือ 1 เล่ม มีคนยืมมาแล้วหลายคน</text>
    <text x="400" y="580" fill="#4b5563">ถ้าอยากเก็บวันยืมวันคืนด้วย</text>
    <text x="400" y="604" fill="#4b5563">ต้องแยกคลาส Loan ออกมา (ภาพที่ 8.10)</text>
  </g>
</svg>
