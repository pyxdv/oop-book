<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="ตู้ ATM เปรียบกับคลาส ข้อมูลข้างในเป็น private ผู้ใช้กดได้แค่ปุ่มที่เป็น public">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <g font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="400" y="38" font-size="22" font-weight="700" text-anchor="middle">ตู้ ATM กับการห่อหุ้ม: ข้างในซ่อนไว้ ข้างนอกมีแต่ปุ่ม</text>

    <!-- ผู้ใช้ -->
    <circle cx="70" cy="180" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <path d="M44,240 Q44,204 70,204 Q96,204 96,240 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="70" y="266" font-size="16" text-anchor="middle">ผู้ใช้</text>
    <text x="70" y="286" font-size="14" fill="#4b5563" text-anchor="middle">(โค้ดภายนอก)</text>

    <!-- ตัวตู้ -->
    <rect x="150" y="70" width="400" height="320" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="350" y="98" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb">ตู้ ATM (ออบเจกต์)</text>

    <g font-size="16" text-anchor="middle">
      <rect x="170" y="118" width="130" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="235" y="146">ฝากเงิน</text>
      <rect x="170" y="174" width="130" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="235" y="202">ถอนเงิน</text>
      <rect x="170" y="230" width="130" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="235" y="258">โอนเงิน</text>
      <rect x="170" y="286" width="130" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="235" y="314">ดูยอดเงิน</text>
    </g>
    <text x="235" y="364" font-size="15" text-anchor="middle" fill="#2563eb" font-weight="700">ปุ่ม = public</text>

    <g stroke="#2563eb" stroke-width="2" marker-end="url(#a)">
      <line x1="300" y1="140" x2="318" y2="140"/>
      <line x1="300" y1="196" x2="318" y2="196"/>
      <line x1="300" y1="252" x2="318" y2="252"/>
      <line x1="300" y1="308" x2="318" y2="308"/>
    </g>

    <!-- ห้องนิรภัย -->
    <rect x="320" y="118" width="212" height="212" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="426" y="146" font-size="16" font-weight="700" text-anchor="middle" fill="#dc2626">ข้างในตู้ = private</text>
    <g font-size="15">
      <text x="338" y="180">ยอดเงิน 3,000 บาท</text>
      <text x="338" y="208">PIN ****</text>
      <text x="338" y="240" fill="#4b5563">กฎ: PIN ต้องถูก</text>
      <text x="338" y="266" fill="#4b5563">กฎ: เงินต้องพอ</text>
      <text x="338" y="292" fill="#4b5563">กฎ: จำนวนต้อง &gt; 0</text>
    </g>
    <text x="426" y="364" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="700">มองไม่เห็นจากข้างนอก</text>

    <!-- ผู้ใช้กดปุ่ม -->
    <line x1="100" y1="196" x2="166" y2="196" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="133" y="186" font-size="14" text-anchor="middle" fill="#2563eb">กด</text>

    <!-- พยายามแตะตรง -->
    <path d="M70,300 L70,425 L426,425 L426,396" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#r)"/>
    <circle cx="426" cy="405" r="0"/>
    <text x="250" y="450" font-size="15" text-anchor="middle" fill="#dc2626">✗ เอื้อมเข้าไปแก้ยอดเงินเองไม่ได้ ต้องผ่านปุ่มเท่านั้น</text>

    <!-- เทียบกับโค้ด -->
    <text x="680" y="98" font-size="16" font-weight="700" text-anchor="middle">เขียนเป็นโค้ด</text>
    <rect x="575" y="112" width="210" height="232" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14">
      <text x="588" y="140">class BankAccount {</text>
      <text x="598" y="168" fill="#dc2626">private balance</text>
      <text x="598" y="192" fill="#dc2626">private pin</text>
      <text x="598" y="222" fill="#2563eb">public deposit()</text>
      <text x="598" y="246" fill="#2563eb">public withdraw()</text>
      <text x="598" y="270" fill="#2563eb">public transfer()</text>
      <text x="598" y="294" fill="#2563eb">public getBalance()</text>
      <text x="588" y="326">}</text>
    </g>
  </g>
</svg>
