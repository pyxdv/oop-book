<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ตัวแปรเก็บที่อยู่ ตัวออบเจกต์อยู่อีกที่</text>
  <text x="140" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">ตัวแปร (เก็บการอ้างอิง)</text>
  <text x="580" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">ออบเจกต์ในหน่วยความจำ</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">
    <rect x="50" y="100" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="66" y="128">student1</text><circle cx="208" cy="122" r="5" fill="#2563eb"/>
    <rect x="50" y="180" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="66" y="208">same</text><circle cx="208" cy="202" r="5" fill="#d97706"/>
    <rect x="50" y="260" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="66" y="288">student2</text><circle cx="208" cy="282" r="5" fill="#059669"/>
  </g>
  <rect x="440" y="92" width="290" height="116" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="456" y="116" font-size="14" fill="#4b5563">ออบเจกต์ Student ชิ้นที่ 1</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">
    <text x="456" y="142">studentId = "001"</text>
    <text x="456" y="164">name      = "สมชาย"</text>
    <text x="456" y="186">gpa       = <tspan fill="#dc2626" text-decoration="line-through">3.5</tspan> 3.8</text>
  </g>
  <rect x="440" y="238" width="290" height="96" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="456" y="262" font-size="14" fill="#4b5563">ออบเจกต์ Student ชิ้นที่ 2</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">
    <text x="456" y="286">studentId = "002"</text>
    <text x="456" y="306">name      = "สมหญิง"</text>
    <text x="456" y="326">gpa       = 3.75</text>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M213,122 L436,128" stroke="#2563eb" marker-end="url(#ar)"/>
    <path d="M213,202 C320,202 340,180 436,176" stroke="#d97706" marker-end="url(#ar)"/>
    <path d="M213,282 L436,284" stroke="#059669" marker-end="url(#ar)"/>
  </g>
  <text x="325" y="114" text-anchor="middle" font-size="14" fill="#4b5563">ชี้ไป</text>
  <text x="325" y="226" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">same = student1</text>
  <text x="325" y="246" text-anchor="middle" font-size="14" fill="#4b5563">คัดลอกที่อยู่ ไม่ใช่ตัวของ</text>
  <text x="140" y="334" text-anchor="middle" font-size="14" fill="#4b5563">same.gpa = 3.8 แก้ชิ้นที่ 1</text>
</svg>
