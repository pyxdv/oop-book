<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 760 432" width="760" height="432" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e293b" flood-opacity=".14"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">เทสต์หนึ่งตัวมีสามช่วง และทำงานเป็นรอบ แดง → เขียว</text><g filter="url(#sh)"><rect x="30" y="62" width="220" height="130" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/></g><text x="46" y="90" font-size="16" font-weight="bold" fill="#0284c7">1 Arrange เตรียม</text><text x="46" y="116" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">new ParallelCircuit()</text><text x="46" y="136" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">  .add(Ra 100 Ω)</text><text x="46" y="156" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">  .add(Rb 100 Ω)</text><g filter="url(#sh)"><rect x="270" y="62" width="220" height="130" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/></g><text x="286" y="90" font-size="16" font-weight="bold" fill="#7c3aed">2 Act เรียกใช้</text><text x="286" y="116" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">double r =</text><text x="286" y="136" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">  p.resistance();</text><g filter="url(#sh)"><rect x="510" y="62" width="220" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/></g><text x="526" y="90" font-size="16" font-weight="bold" fill="#16a34a">3 Assert ตรวจผล</text><text x="526" y="116" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">assertEquals(</text><text x="526" y="136" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">  50.0, r, 1e-9);</text><text x="526" y="156" font-size="12.5" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">// คาดหวัง ได้จริง delta</text><line x1="252" y1="127" x2="266" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="492" y1="127" x2="506" y2="127" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="40" y1="216" x2="720" y2="216" stroke="#e5e7eb" stroke-width="2"/><g filter="url(#sh)"><circle cx="130" cy="316" r="52" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/></g><text x="130" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">เขียนเทสต์</text><text x="130" y="332" text-anchor="middle" font-size="12" fill="#475569">คิดคำตอบด้วยมือ</text><g filter="url(#sh)"><circle cx="300" cy="316" r="52" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/></g><text x="300" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">แดง</text><text x="300" y="332" text-anchor="middle" font-size="12" fill="#475569">เทสต์ไม่ผ่าน</text><g filter="url(#sh)"><circle cx="470" cy="316" r="52" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/></g><text x="470" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">แก้โค้ด</text><text x="470" y="332" text-anchor="middle" font-size="12" fill="#475569">debugger ช่วยหา</text><g filter="url(#sh)"><circle cx="640" cy="316" r="52" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/></g><text x="640" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">เขียว</text><text x="640" y="332" text-anchor="middle" font-size="12" fill="#475569">ผ่านครบ เก็บเทสต์ไว้</text><line x1="184" y1="316" x2="246" y2="316" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="354" y1="316" x2="416" y2="316" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="524" y1="316" x2="586" y2="316" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><path d="M640 368 C 640 404, 130 404, 130 370" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="385" y="416" text-anchor="middle" font-size="12.5" fill="#64748b">ความสามารถใหม่หรือบั๊กใหม่ เริ่มรอบใหม่ เทสต์เก่าทุกตัวต้องยังเขียว</text>
</svg>
