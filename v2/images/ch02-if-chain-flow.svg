<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 760 620" width="760" height="620" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">if-else-if ทำงานอย่างไร เมื่อ score = 85</text>
  <!-- start -->
  <rect x="140" y="56" width="160" height="38" rx="19" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="220" y="81" text-anchor="middle" font-size="15" fill="#1f2937">เริ่ม (score = 85)</text>
  <line x1="220" y1="94" x2="220" y2="118" stroke="#2563eb" stroke-width="3" marker-end="url(#arb)"/>
  <!-- diamonds cy = 155, 245, 335, 425 -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" text-anchor="middle" fill="#1f2937">
    <polygon points="120,155 220,120 320,155 220,190" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="220" y="160">score &gt;= 80</text>
    <polygon points="120,245 220,210 320,245 220,280" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="220" y="250">score &gt;= 70</text>
    <polygon points="120,335 220,300 320,335 220,370" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="220" y="340">score &gt;= 60</text>
    <polygon points="120,425 220,390 320,425 220,460" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="220" y="430">score &gt;= 50</text>
  </g>
  <!-- no arrows -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="220" y1="190" x2="220" y2="208" marker-end="url(#ar)"/>
    <line x1="220" y1="280" x2="220" y2="298" marker-end="url(#ar)"/>
    <line x1="220" y1="370" x2="220" y2="388" marker-end="url(#ar)"/>
    <line x1="220" y1="460" x2="220" y2="488" marker-end="url(#ar)"/>
  </g>
  <g font-size="14" fill="#4b5563">
    <text x="228" y="205">ไม่</text><text x="228" y="295">ไม่</text>
    <text x="228" y="385">ไม่</text><text x="228" y="480">ไม่ (else)</text>
  </g>
  <!-- yes arrows -->
  <line x1="320" y1="155" x2="418" y2="155" stroke="#2563eb" stroke-width="3" marker-end="url(#arb)"/>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="320" y1="245" x2="418" y2="245" marker-end="url(#ar)"/>
    <line x1="320" y1="335" x2="418" y2="335" marker-end="url(#ar)"/>
    <line x1="320" y1="425" x2="418" y2="425" marker-end="url(#ar)"/>
  </g>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="368" y="146" fill="#2563eb" font-weight="bold">ใช่ ✓</text><text x="368" y="236">ใช่</text>
    <text x="368" y="326">ใช่</text><text x="368" y="416">ใช่</text>
  </g>
  <!-- result boxes -->
  <rect x="420" y="135" width="150" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
  <text x="495" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">พิมพ์ เกรด A</text>
  <g font-size="16" fill="#1f2937" text-anchor="middle">
    <rect x="420" y="225" width="150" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="495" y="251">พิมพ์ เกรด B</text>
    <rect x="420" y="315" width="150" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="495" y="341">พิมพ์ เกรด C</text>
    <rect x="420" y="405" width="150" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="495" y="431">พิมพ์ เกรด D</text>
    <rect x="145" y="490" width="150" height="40" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="220" y="516">พิมพ์ เกรด F</text>
  </g>
  <!-- merge line -->
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <line x1="570" y1="245" x2="650" y2="245"/>
    <line x1="570" y1="335" x2="650" y2="335"/>
    <line x1="570" y1="425" x2="650" y2="425"/>
    <line x1="220" y1="530" x2="220" y2="558" marker-end="url(#ar)"/>
  </g>
  <polyline points="570,155 650,155 650,558" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arb)"/>
  <rect x="140" y="560" width="560" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="420" y="586" text-anchor="middle" font-size="16" fill="#1f2937">ทำคำสั่งถัดไปหลังบล็อก if-else-if</text>
  <text x="690" y="300" text-anchor="middle" font-size="14" fill="#2563eb" transform="rotate(90 690 300)">ทางที่ score = 85 วิ่งจริง</text>
</svg>
