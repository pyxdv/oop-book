<text x="446" y="118" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold" fill="#1f2937">processUserData()</text>
<text x="462" y="142" font-size="14" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#4b5563">if (!isValidUser(u)) return;</text>
<text x="462" y="162" font-size="14" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#4b5563">saveUser(u); sendWelcome...</text>
