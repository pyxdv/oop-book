<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" width="780" height="390" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ขั้นตอน Model-Based Coding (ตัวอย่างระบบห้องสมุด)</text>

  <g stroke-width="2">
    <rect x="20" y="70" width="168" height="200" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="214" y="70" width="168" height="200" rx="12" fill="#d1fae5" stroke="#059669"/>
    <rect x="408" y="70" width="168" height="200" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="602" y="70" width="168" height="200" rx="12" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <circle cx="104" cy="98" r="16" fill="#2563eb"/><text x="104" y="105">1</text>
    <circle cx="298" cy="98" r="16" fill="#059669"/><text x="298" y="105">2</text>
    <circle cx="492" cy="98" r="16" fill="#7c3aed"/><text x="492" y="105">3</text>
    <circle cx="686" cy="98" r="16" fill="#d97706"/><text x="686" y="105">4</text>
  </g>
  <g font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="104" y="140">วิเคราะห์</text><text x="104" y="162">ความต้องการ</text>
    <text x="298" y="140">หาคลาส</text><text x="298" y="162">และหน้าที่</text>
    <text x="492" y="140">วาดแผนภาพ</text><text x="492" y="162">คลาส</text>
    <text x="686" y="140">เขียนโค้ด</text><text x="686" y="162">ตามแผนภาพ</text>
  </g>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="104" y="196">ต้องยืม-คืนหนังสือได้</text><text x="104" y="218">ต้องรู้ว่าใครยืม</text><text x="104" y="240">ต้องคืนเมื่อไร</text>
    <text x="298" y="196">Book, Member,</text><text x="298" y="218">Loan, Library</text><text x="298" y="240">(มักมาจากคำนาม)</text>
    <text x="492" y="196">ใส่แอตทริบิวต์</text><text x="492" y="218">เมธอด และเส้น</text><text x="492" y="240">ความสัมพันธ์</text>
    <text x="686" y="196">แปลทีละกล่อง</text><text x="686" y="218">ทีละเส้น</text><text x="686" y="240">เป็นคลาส Java</text>
  </g>

  <!-- ลูกศรไปข้างหน้า -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="188" y1="170" x2="204" y2="170"/>
    <line x1="382" y1="170" x2="398" y2="170"/>
    <line x1="576" y1="170" x2="592" y2="170"/>
  </g>
  <g fill="#1f2937">
    <polygon points="213,170 203,164 203,176"/>
    <polygon points="407,170 397,164 397,176"/>
    <polygon points="601,170 591,164 591,176"/>
  </g>

  <!-- วงย้อนกลับ -->
  <path d="M686,270 V310 H492 V284" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <polygon points="492,272 485,286 499,286" fill="#dc2626"/>
  <text x="589" y="338" text-anchor="middle" font-size="15" fill="#1f2937">รีวิวแล้วเจอจุดผิด หรือโค้ดเปลี่ยน</text>
  <text x="589" y="360" text-anchor="middle" font-size="15" fill="#1f2937">กลับไปแก้แผนภาพให้ตรงกับโค้ด</text>
  <text x="200" y="318" text-anchor="middle" font-size="15" fill="#4b5563">ขั้น 1-3 ยังไม่ต้องเขียนโค้ดสักบรรทัด</text>
  <text x="200" y="340" text-anchor="middle" font-size="15" fill="#4b5563">แก้บนกระดาษ ถูกกว่าแก้โค้ดเสมอ</text>
</svg>
