<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="390" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">กล่องคลาสหนึ่งกล่อง แบ่งเป็น 3 ช่อง</text>

  <!-- กล่องคลาส -->
  <rect x="50" y="70" width="340" height="270" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="51" y="71" width="338" height="49" fill="#dbeafe"/>
  <rect x="51" y="121" width="338" height="109" fill="#d1fae5"/>
  <rect x="51" y="231" width="338" height="108" fill="#ede9fe"/>
  <line x1="50" y1="120" x2="390" y2="120" stroke="#1f2937" stroke-width="2"/>
  <line x1="50" y1="230" x2="390" y2="230" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="102" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Student</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" fill="#1f2937">
    <text x="66" y="153">- studentId : String</text>
    <text x="66" y="183">- name : String</text>
    <text x="66" y="213">- gpa : double</text>
    <text x="66" y="263">+ getStudentId() : String</text>
    <text x="66" y="293">+ setName(name : String)</text>
    <text x="66" y="323">+ calculateGrade() : String</text>
  </g>

  <!-- วงเล็บและคำอธิบายด้านขวา -->
  <g stroke="#4b5563" stroke-width="1.5" fill="none">
    <path d="M404,74 h10 v42 h-10"/>
    <path d="M404,126 h10 v100 h-10"/>
    <path d="M404,236 h10 v100 h-10"/>
    <line x1="414" y1="95" x2="440" y2="95"/>
    <line x1="414" y1="176" x2="440" y2="176"/>
    <line x1="414" y1="286" x2="440" y2="286"/>
  </g>
  <text x="450" y="92" font-size="17" font-weight="bold" fill="#2563eb">ช่องที่ 1 ชื่อคลาส</text>
  <text x="450" y="114" font-size="15" fill="#4b5563">ตัวหนา ขึ้นต้นด้วยตัวพิมพ์ใหญ่</text>
  <text x="450" y="170" font-size="17" font-weight="bold" fill="#059669">ช่องที่ 2 แอตทริบิวต์</text>
  <text x="450" y="192" font-size="15" fill="#4b5563">รูปแบบ  ชื่อ : ชนิดข้อมูล</text>
  <text x="450" y="280" font-size="17" font-weight="bold" fill="#7c3aed">ช่องที่ 3 เมธอด</text>
  <text x="450" y="302" font-size="15" fill="#4b5563">ชื่อ(พารามิเตอร์) : ชนิดที่คืนค่า</text>

  <!-- ชี้เครื่องหมายสิทธิ์ -->
  <rect x="60" y="138" width="16" height="190" rx="4" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="68" y1="330" x2="68" y2="372" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="68,330 63,340 73,340" fill="#d97706"/>
  <text x="80" y="380" font-size="16" fill="#1f2937"><tspan font-weight="bold" fill="#d97706">+ - # ~</tspan> หน้าชื่อ คือตัวกำหนดสิทธิ์การเข้าถึง</text>
  <text x="80" y="404" font-size="15" fill="#4b5563">ตัวอย่าง  <tspan font-weight="bold">-</tspan> คือ private  และ  <tspan font-weight="bold">+</tspan> คือ public  (ตารางเต็มอยู่ในภาพที่ 8.2)</text>
</svg>
