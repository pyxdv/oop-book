<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img" aria-label="ตัวแปรอาร์เรย์เก็บที่อยู่ของอาร์เรย์บน heap เมื่อ b = a ทั้งสองชี้ก้อนเดียวกัน ส่วน arr1 กับ arr2 เป็นคนละก้อนแม้ค่าข้างในเท่ากัน">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <g style="font-variant-ligatures:none" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="390" y="38" font-size="22" font-weight="bold" text-anchor="middle">ตัวแปรอาร์เรย์เก็บ "ที่อยู่" ไม่ได้เก็บตัวอาร์เรย์</text>
    <!-- column headers -->
    <text x="110" y="72" font-size="15" text-anchor="middle" fill="#4b5563">ตัวแปร (stack)</text>
    <text x="420" y="72" font-size="15" text-anchor="middle" fill="#4b5563">ตัวอาร์เรย์จริง (heap)</text>
    <line x1="230" y1="60" x2="230" y2="450" stroke="#e5e7eb" stroke-width="2"/>

    <!-- section A -->
    <rect x="20" y="84" width="740" height="30" rx="6" fill="#f3f4f6"/>
    <text x="34" y="105" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int[] a = {1, 2, 3};   int[] b = a;</text>

    <rect x="50" y="130" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="156" font-size="16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">a</text>
    <circle cx="150" cy="150" r="5" fill="#2563eb"/>
    <rect x="50" y="190" width="120" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="216" font-size="16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">b</text>
    <circle cx="150" cy="210" r="5" fill="#2563eb"/>

    <text x="420" y="144" font-size="14" text-anchor="middle" fill="#4b5563">int[3]  length = 3</text>
    <g stroke="#9ca3af" stroke-width="2" fill="#f9fafb">
      <rect x="330" y="152" width="60" height="44"/>
      <rect x="390" y="152" width="60" height="44"/>
      <rect x="450" y="152" width="60" height="44"/>
    </g>
    <g font-size="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="360" y="181">1</text><text x="420" y="181">2</text><text x="480" y="181">3</text>
    </g>
    <path d="M150,150 C240,150 260,166 326,170" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
    <path d="M150,210 C240,210 260,186 326,180" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

    <text x="540" y="160" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#059669" font-weight="bold">a == b  →  true</text>
    <text x="540" y="186" font-size="15">ชี้อาร์เรย์ก้อนเดียวกัน</text>
    <text x="540" y="210" font-size="15">แก้ผ่าน b แล้ว a เห็นด้วย</text>

    <!-- section B -->
    <rect x="20" y="262" width="740" height="30" rx="6" fill="#f3f4f6"/>
    <text x="34" y="283" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int[] arr1 = {1, 2, 3};   int[] arr2 = {1, 2, 3};</text>

    <rect x="50" y="318" width="120" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="64" y="344" font-size="16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">arr1</text>
    <circle cx="150" cy="338" r="5" fill="#7c3aed"/>
    <rect x="50" y="392" width="120" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="64" y="418" font-size="16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">arr2</text>
    <circle cx="150" cy="412" r="5" fill="#7c3aed"/>

    <g stroke="#9ca3af" stroke-width="2" fill="#f9fafb">
      <rect x="330" y="316" width="60" height="44"/><rect x="390" y="316" width="60" height="44"/><rect x="450" y="316" width="60" height="44"/>
      <rect x="330" y="390" width="60" height="44"/><rect x="390" y="390" width="60" height="44"/><rect x="450" y="390" width="60" height="44"/>
    </g>
    <g font-size="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="360" y="345">1</text><text x="420" y="345">2</text><text x="480" y="345">3</text>
      <text x="360" y="419">1</text><text x="420" y="419">2</text><text x="480" y="419">3</text>
    </g>
    <line x1="150" y1="338" x2="324" y2="338" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>
    <line x1="150" y1="412" x2="324" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#m)"/>

    <text x="540" y="340" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#dc2626" font-weight="bold">arr1 == arr2 → false</text>
    <text x="540" y="364" font-size="15">คนละก้อน ที่อยู่ไม่เท่ากัน</text>
    <text x="540" y="400" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#059669" font-weight="bold">Arrays.equals → true</text>
    <text x="540" y="424" font-size="15">ค่าข้างในเท่ากันทุกช่อง</text>
  </g>
</svg>
