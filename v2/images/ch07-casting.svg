<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L11,6 L0,12 z" fill="#ffffff" stroke="#4b5563" stroke-width="1.2"/></marker>
  </defs>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Upcasting, downcasting และ instanceof</text>

  <!-- left: hierarchy -->
  <rect x="140" y="75" width="140" height="46" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="210" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Animal</text>
  <rect x="110" y="235" width="100" height="46" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="160" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Dog</text>
  <rect x="230" y="235" width="100" height="46" rx="8" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="280" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Cat</text>
  <path d="M160,235 L160,180 L210,180 L210,123" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#tri)"/>
  <path d="M280,235 L280,180 L210,180" fill="none" stroke="#4b5563" stroke-width="1.5"/>

  <path d="M108,258 L60,258 L60,98 L136,98" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
  <text x="48" y="180" text-anchor="middle" font-size="14" fill="#059669" transform="rotate(-90 48 180)">upcast</text>
  <path d="M150,124 L128,231" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#o)"/>
  <text x="100" y="185" text-anchor="middle" font-size="14" fill="#b45309">down</text>

  <g font-size="14">
    <rect x="24" y="310" width="320" height="64" rx="10" fill="#d1fae5"/>
    <text x="36" y="334" fill="#059669" font-weight="bold">↑ upcasting ✓ ทำให้อัตโนมัติ</text>
    <text x="36" y="360" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Animal a = new Dog();</text>
    <rect x="24" y="386" width="320" height="64" rx="10" fill="#fef3c7"/>
    <text x="36" y="410" fill="#b45309" font-weight="bold">↓ downcasting ⚠ ต้องเขียนวงเล็บเอง</text>
    <text x="36" y="436" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Dog d = (Dog) a;</text>
  </g>

  <line x1="372" y1="70" x2="372" y2="450" stroke="#e5e7eb" stroke-width="2"/>

  <!-- right: decision -->
  <text x="585" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">ก่อน downcast ให้ถามก่อน</text>
  <rect x="470" y="98" width="230" height="50" rx="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="585" y="129" text-anchor="middle" font-size="16" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">x instanceof Dog ?</text>

  <line x1="530" y1="148" x2="470" y2="200" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <text x="462" y="178" font-size="14" fill="#059669" text-anchor="end">true</text>
  <line x1="640" y1="148" x2="700" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#k)"/>
  <text x="708" y="178" font-size="14" fill="#4b5563">false</text>

  <rect x="388" y="204" width="180" height="96" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="478" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">✓ แปลงได้ปลอดภัย</text>
  <text x="478" y="258" text-anchor="middle" font-size="14" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">((Dog) x).fetch()</text>
  <text x="478" y="284" text-anchor="middle" font-size="14" fill="#4b5563">เช่น x = new Dog()</text>

  <rect x="602" y="204" width="180" height="96" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="692" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">ไม่ต้องแปลง</text>
  <text x="692" y="258" text-anchor="middle" font-size="14" fill="#1f2937">ทำทางอื่นแทน</text>
  <text x="692" y="284" text-anchor="middle" font-size="14" fill="#4b5563">เช่น x = new Cat()</text>

  <line x1="692" y1="300" x2="692" y2="356" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="682" y="334" text-anchor="end" font-size="14" fill="#dc2626">ถ้าฝืนเขียน (Dog) x</text>
  <rect x="560" y="360" width="222" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="671" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">✗ ClassCastException</text>
  <text x="671" y="418" text-anchor="middle" font-size="14" fill="#1f2937">คอมไพล์ผ่าน แต่พังตอนรัน</text>
</svg>
