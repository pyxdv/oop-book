<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">วงจรเดียวกัน มองเป็นผังวงจรและเป็นแผนภาพคลาส</text><rect x="24" y="62" width="320" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="184" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">ผังวงจร</text><polyline points="60,150 60,200" fill="none" stroke="#1f2937" stroke-width="2"/><line x1="46" y1="200" x2="74" y2="200" stroke="#1f2937" stroke-width="2.5"/><line x1="52" y1="210" x2="68" y2="210" stroke="#1f2937" stroke-width="2.5"/><polyline points="60,210 60,320 290,320 290,270" fill="none" stroke="#1f2937" stroke-width="2"/><text x="84" y="210" font-size="14" font-weight="bold" fill="#b45309">12 V</text><polyline points="60,150 60,120 110,120" fill="none" stroke="#1f2937" stroke-width="2"/><path d="M110 120 L115 127 L125 113 L135 127 L145 113 L155 127 L165 113 L170 120" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><polyline points="170,120 220,120" fill="none" stroke="#1f2937" stroke-width="2"/><text x="140" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">R1 = 100 Ω</text><polyline points="220,120 220,150" fill="none" stroke="#1f2937" stroke-width="2"/><polyline points="220,150 200,150 200,180" fill="none" stroke="#1f2937" stroke-width="2"/><polyline points="220,150 240,150 240,180" fill="none" stroke="#1f2937" stroke-width="2"/><g transform="translate(0,0)"><path d="M200 180 L207 185 L193 195 L207 205 L193 215 L207 225 L193 235 L200 240" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M240 180 L247 185 L233 195 L247 205 L233 215 L247 225 L233 235 L240 240" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/></g><polyline points="200,240 200,250 240,250 240,240" fill="none" stroke="#1f2937" stroke-width="2"/><polyline points="220,250 220,270 290,270" fill="none" stroke="#1f2937" stroke-width="2"/><text x="178" y="212" text-anchor="end" font-size="13" font-weight="bold" fill="#16a34a">R2</text><text x="178" y="228" text-anchor="end" font-size="12" fill="#16a34a">200 Ω</text><text x="266" y="212" font-size="13" font-weight="bold" fill="#16a34a">R3</text><text x="266" y="228" font-size="12" fill="#16a34a">300 Ω</text><rect x="184" y="160" width="76" height="98" rx="8" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="222" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#16a34a">ขนาน = 120 Ω</text><rect x="96" y="96" width="176" height="176" rx="10" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="2 4"/><text x="184" y="346" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0369a1">อนุกรมทั้งหมด = 100 + 120 = 220 Ω</text><g filter="url(#sh)"><rect x="468" y="62" width="210" height="93" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/></g><rect x="468" y="62" width="210" height="26" rx="6" fill="#ede9fe"/><rect x="468" y="82" width="210" height="6" fill="#ede9fe"/><text x="573" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937" font-style="italic">«abstract» CircuitElement</text><line x1="468" y1="88" x2="678" y2="88" stroke="#7c3aed"/><line x1="468" y1="113" x2="678" y2="113" stroke="#7c3aed"/><text x="476" y="130" font-size="12" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#334155" font-style="italic">+ resistance(): double</text><text x="476" y="147" font-size="12" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#334155">+ current(v: double): double</text><g filter="url(#sh)"><rect x="340" y="196" width="180" height="93" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/></g><rect x="340" y="196" width="180" height="26" rx="6" fill="#e0f2fe"/><rect x="340" y="216" width="180" height="6" fill="#e0f2fe"/><text x="430" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Resistor</text><line x1="340" y1="222" x2="520" y2="222" stroke="#0284c7"/><line x1="340" y1="264" x2="520" y2="264" stroke="#0284c7"/><text x="348" y="239" font-size="12" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">- label: String</text><text x="348" y="256" font-size="12" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">- ohms: double</text><text x="348" y="281" font-size="12" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#334155">+ resistance(): double</text><g filter="url(#sh)"><rect x="536" y="196" width="214" height="76" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/></g><rect x="536" y="196" width="214" height="26" rx="6" fill="#ede9fe"/><rect x="536" y="216" width="214" height="6" fill="#ede9fe"/><text x="643" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937" font-style="italic">«abstract» Network</text><line x1="536" y1="222" x2="750" y2="222" stroke="#7c3aed"/><line x1="536" y1="247" x2="750" y2="247" stroke="#7c3aed"/><text x="544" y="239" font-size="12" fill="#334155" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">- parts: List&lt;CircuitElement&gt;</text><text x="544" y="264" font-size="12" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#334155">+ add(p): Network</text><g filter="url(#sh)"><rect x="500" y="330" width="120" height="76" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/></g><rect x="500" y="330" width="120" height="26" rx="6" fill="#dcfce7"/><rect x="500" y="350" width="120" height="6" fill="#dcfce7"/><text x="560" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">SeriesCircuit</text><line x1="500" y1="356" x2="620" y2="356" stroke="#16a34a"/><line x1="500" y1="381" x2="620" y2="381" stroke="#16a34a"/><text x="508" y="398" font-size="12" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#334155">+ resistance()</text><g filter="url(#sh)"><rect x="632" y="330" width="120" height="76" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/></g><rect x="632" y="330" width="120" height="26" rx="6" fill="#dcfce7"/><rect x="632" y="350" width="120" height="6" fill="#dcfce7"/><text x="692" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ParallelCircuit</text><line x1="632" y1="356" x2="752" y2="356" stroke="#16a34a"/><line x1="632" y1="381" x2="752" y2="381" stroke="#16a34a"/><text x="640" y="398" font-size="12" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#334155">+ resistance()</text><polyline points="430,196 430,181 643,181 643,196" fill="none" stroke="#475569" stroke-width="1.6"/><line x1="573" y1="168" x2="573" y2="181" stroke="#475569" stroke-width="1.6"/><path d="M573 155 L565 168 L581 168 Z" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><polyline points="560,330 560,292 692,292 692,330" fill="none" stroke="#475569" stroke-width="1.6"/><line x1="643" y1="285" x2="643" y2="292" stroke="#475569" stroke-width="1.6"/><path d="M643 272 L635 285 L651 285 Z" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><path d="M724 196 l-5 -8 l5 -8 l5 8 Z" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><polyline points="724,180 724,102 678,102" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ar)"/><text x="730" y="128" font-size="12" font-weight="bold" fill="#7c3aed">parts</text><text x="730" y="144" font-size="12" font-weight="bold" fill="#7c3aed">0..*</text><text x="380" y="440" text-anchor="middle" font-size="12.5" fill="#64748b">หัวสามเหลี่ยม = สืบทอด · หัวข้าวหลามตัด = Network เก็บชิ้นส่วน (CircuitElement) ไว้หลายชิ้น</text>
</svg>
