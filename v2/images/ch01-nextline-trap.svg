<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="nextInt อ่านแค่ตัวเลขแล้วทิ้ง Enter ค้างไว้ ทำให้ nextLine ตัวถัดไปได้ข้อความว่าง">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <g font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="400" y="36" font-size="22" font-weight="bold" text-anchor="middle">ทำไม nextLine() หลัง nextInt() ถึงได้ข้อความว่าง</text>
    <text x="30" y="70" font-size="15" fill="#4b5563">ผู้ใช้พิมพ์ 19 กด Enter แล้วพิมพ์ สมหญิง กด Enter ข้อมูลจะต่อกันเป็นแถวเดียวแบบนี้</text>
    <!-- row A -->
    <text x="30" y="112" font-size="16" font-weight="bold" fill="#dc2626">✗ แบบที่พลาด</text>
    <g style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" text-anchor="middle">
      <rect x="200" y="90" width="44" height="40" fill="#dbeafe" stroke="#2563eb"/><text x="222" y="116">1</text>
      <rect x="244" y="90" width="44" height="40" fill="#dbeafe" stroke="#2563eb"/><text x="266" y="116">9</text>
      <rect x="288" y="90" width="54" height="40" fill="#fee2e2" stroke="#dc2626"/><text x="315" y="116">\n</text>
      <rect x="342" y="90" width="120" height="40" fill="#f3f4f6" stroke="#9ca3af"/><text x="402" y="116" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">สมหญิง</text>
      <rect x="462" y="90" width="54" height="40" fill="#f3f4f6" stroke="#9ca3af"/><text x="489" y="116">\n</text>
    </g>
    <path d="M202,138 L202,146 L286,146 L286,138" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="244" y="168" font-size="14" text-anchor="middle" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#2563eb">nextInt()</text>
    <text x="244" y="188" font-size="14" text-anchor="middle" fill="#2563eb">ได้ 19</text>
    <path d="M290,138 L290,146 L340,146 L340,138" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="345" y="168" font-size="14" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#dc2626">nextLine()</text>
    <text x="345" y="188" font-size="14" fill="#dc2626">อ่านถึง \n ทันที ได้ "" (ว่าง)</text>
    <text x="545" y="116" font-size="14" fill="#4b5563">สมหญิง ยังไม่มีใครอ่าน</text>
    <line x1="20" y1="215" x2="780" y2="215" stroke="#9ca3af" stroke-dasharray="4 4"/>
    <!-- row B -->
    <text x="30" y="262" font-size="16" font-weight="bold" fill="#059669">✓ แบบที่ถูก</text>
    <g style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" text-anchor="middle">
      <rect x="200" y="240" width="44" height="40" fill="#dbeafe" stroke="#2563eb"/><text x="222" y="266">1</text>
      <rect x="244" y="240" width="44" height="40" fill="#dbeafe" stroke="#2563eb"/><text x="266" y="266">9</text>
      <rect x="288" y="240" width="54" height="40" fill="#f3f4f6" stroke="#9ca3af"/><text x="315" y="266">\n</text>
      <rect x="342" y="240" width="120" height="40" fill="#d1fae5" stroke="#059669"/><text x="402" y="266" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">สมหญิง</text>
      <rect x="462" y="240" width="54" height="40" fill="#d1fae5" stroke="#059669"/><text x="489" y="266">\n</text>
    </g>
    <path d="M202,288 L202,296 L286,296 L286,288" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="244" y="318" font-size="14" text-anchor="middle" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#2563eb">nextInt()</text>
    <text x="244" y="338" font-size="14" text-anchor="middle" fill="#2563eb">ได้ 19</text>
    <path d="M290,288 L290,296 L340,296 L340,288" stroke="#4b5563" stroke-width="2" fill="none"/>
    <text x="315" y="365" font-size="14" text-anchor="middle" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#4b5563">nextLine()</text>
    <text x="315" y="385" font-size="14" text-anchor="middle" fill="#4b5563">ทิ้ง \n</text>
    <line x1="315" y1="300" x2="315" y2="348" stroke="#4b5563" stroke-width="1.5"/>
    <path d="M344,288 L344,296 L514,296 L514,288" stroke="#059669" stroke-width="2" fill="none"/>
    <text x="430" y="318" font-size="14" text-anchor="middle" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#059669">nextLine()</text>
    <text x="430" y="338" font-size="14" text-anchor="middle" fill="#059669">ได้ "สมหญิง"</text>
    <text x="400" y="415" font-size="15" text-anchor="middle" fill="#1f2937">nextInt() และ nextDouble() อ่านแค่ตัวเลข ไม่กิน Enter ที่ตามมา</text>
  </g>
</svg>
