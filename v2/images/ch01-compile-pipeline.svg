<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="ซอร์สโค้ดถูกคอมไพล์ด้วย javac เป็นไบต์โค้ด แล้ว JVM รันไบต์โค้ดได้ทุกระบบ">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <g font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="400" y="36" font-size="22" font-weight="bold" text-anchor="middle">จากโค้ดที่เราเขียน ไปจนเห็นผลบนจอ</text>
    <!-- phase bands -->
    <rect x="20" y="60" width="400" height="28" rx="6" fill="#ede9fe"/>
    <text x="220" y="80" font-size="15" text-anchor="middle" fill="#7c3aed">ขั้นคอมไพล์ (ทำครั้งเดียวหลังแก้โค้ด)</text>
    <rect x="440" y="60" width="340" height="28" rx="6" fill="#d1fae5"/>
    <text x="610" y="80" font-size="15" text-anchor="middle" fill="#059669">ขั้นรัน (ทำกี่ครั้งก็ได้)</text>
    <!-- boxes -->
    <rect x="20" y="110" width="170" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="105" y="143" font-size="15" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle">HelloWorld.java</text>
    <text x="105" y="170" font-size="14" text-anchor="middle" fill="#4b5563">ซอร์สโค้ด คนอ่านออก</text>
    <rect x="250" y="110" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="335" y="143" font-size="15" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle">HelloWorld.class</text>
    <text x="335" y="170" font-size="14" text-anchor="middle" fill="#4b5563">ไบต์โค้ด (bytecode)</text>
    <rect x="480" y="110" width="140" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="550" y="143" font-size="17" font-weight="bold" text-anchor="middle">JVM</text>
    <text x="550" y="170" font-size="14" text-anchor="middle" fill="#4b5563">แปลเป็นคำสั่งเครื่อง</text>
    <rect x="660" y="110" width="120" height="80" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="720" y="143" font-size="14" text-anchor="middle" fill="#4b5563">ผลบนจอ</text>
    <text x="720" y="170" font-size="14" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle">Hello, World!</text>
    <!-- arrow labels -->
    <text x="220" y="128" font-size="15" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">javac</text>
    <text x="450" y="128" font-size="15" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle" font-weight="bold">java</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="190" y1="150" x2="248" y2="150" marker-end="url(#arr)"/>
    <line x1="420" y1="150" x2="478" y2="150" marker-end="url(#arr)"/>
    <line x1="620" y1="150" x2="658" y2="150" marker-end="url(#arr)"/>
    <path d="M335,190 L335,230 M335,230 L120,230 L120,268 M335,230 L335,268 M335,230 L550,230 L550,268"/>
    <line x1="120" y1="262" x2="120" y2="270" marker-end="url(#arr)"/>
    <line x1="335" y1="262" x2="335" y2="270" marker-end="url(#arr)"/>
    <line x1="550" y1="262" x2="550" y2="270" marker-end="url(#arr)"/>
  </g>
  <g font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="345" y="222" font-size="14" fill="#4b5563">ไฟล์ .class ไฟล์เดียวกัน</text>
    <rect x="50" y="272" width="140" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="120" y="303" font-size="15" text-anchor="middle">JVM บน Windows</text>
    <rect x="265" y="272" width="140" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="335" y="303" font-size="15" text-anchor="middle">JVM บน macOS</text>
    <rect x="480" y="272" width="140" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="550" y="303" font-size="15" text-anchor="middle">JVM บน Linux</text>
    <text x="400" y="365" font-size="16" text-anchor="middle">คอมไพล์ครั้งเดียว เอาไบต์โค้ดไปรันได้ทุกเครื่องที่มี JVM</text>
  </g>
</svg>
