<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ช่องไหนในแผนภาพ กลายเป็นบรรทัดไหนในโค้ด</text>
  <text x="185" y="62" text-anchor="middle" font-size="15" fill="#4b5563">แผนภาพคลาส</text>
  <text x="585" y="62" text-anchor="middle" font-size="15" fill="#4b5563">โค้ด Java (ละตัวเมธอดไว้)</text>

  <!-- แถบสีที่จับคู่กัน -->
  <rect x="20" y="72" width="330" height="38" fill="#dbeafe"/>
  <rect x="20" y="110" width="330" height="62" fill="#d1fae5"/>
  <rect x="20" y="172" width="330" height="88" fill="#ede9fe"/>
  <rect x="400" y="72" width="370" height="200" rx="10" fill="#f3f4f6"/>
  <rect x="400" y="80" width="370" height="24" fill="#dbeafe"/>
  <rect x="400" y="120" width="370" height="50" fill="#d1fae5"/>
  <rect x="400" y="180" width="370" height="78" fill="#ede9fe"/>

  <!-- กล่องคลาส -->
  <rect x="20" y="72" width="330" height="188" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="20" y1="110" x2="350" y2="110" stroke="#1f2937" stroke-width="2"/>
  <line x1="20" y1="172" x2="350" y2="172" stroke="#1f2937" stroke-width="2"/>
  <text x="185" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">BankAccount</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">
    <text x="30" y="137">- accountNumber : int</text>
    <text x="30" y="161">- balance : double</text>
    <text x="30" y="197">+ deposit(amount : double)</text>
    <text x="30" y="221">+ withdraw(amount : double) : boolean</text>
    <text x="30" y="245">+ getBalance() : double</text>

    <text x="410" y="97">public class BankAccount {</text>
    <text x="430" y="137">private int accountNumber;</text>
    <text x="430" y="161">private double balance;</text>
    <text x="430" y="197">public void deposit(double amount)</text>
    <text x="430" y="221">public boolean withdraw(double amount)</text>
    <text x="430" y="245">public double getBalance()</text>
    <text x="410" y="266">}</text>
  </g>
  <!-- ลูกศรจับคู่ -->
  <g stroke="#4b5563" stroke-width="1.8">
    <line x1="352" y1="92" x2="390" y2="92"/>
    <line x1="352" y1="141" x2="390" y2="141"/>
    <line x1="352" y1="216" x2="390" y2="216"/>
  </g>
  <g fill="#4b5563">
    <polygon points="398,92 388,87 388,97"/>
    <polygon points="398,141 388,136 388,146"/>
    <polygon points="398,216 388,211 388,221"/>
  </g>

  <!-- กฎแปลง -->
  <text x="40" y="318" font-size="18" font-weight="bold" fill="#1f2937">กฎแปลงที่ใช้บ่อย</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">
    <rect x="40" y="334" width="260" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="359">-</text>
    <rect x="450" y="334" width="310" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="464" y="359">private</text>

    <rect x="40" y="384" width="260" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="409">+</text>
    <rect x="450" y="384" width="310" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="464" y="409">public</text>

    <rect x="40" y="434" width="260" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="459">balance : double</text>
    <rect x="450" y="434" width="310" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="464" y="459">double balance</text>

    <rect x="40" y="484" width="260" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="509">deposit(amount : double)</text>
    <rect x="450" y="484" width="310" height="38" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="464" y="509">void deposit(double amount)</text>
  </g>
  <g stroke="#2563eb" stroke-width="2">
    <line x1="306" y1="353" x2="434" y2="353"/>
    <line x1="306" y1="403" x2="434" y2="403"/>
    <line x1="306" y1="453" x2="434" y2="453"/>
    <line x1="306" y1="503" x2="434" y2="503"/>
  </g>
  <g fill="#2563eb">
    <polygon points="444,353 432,347 432,359"/>
    <polygon points="444,403 432,397 432,409"/>
    <polygon points="444,453 432,447 432,459"/>
    <polygon points="444,503 432,497 432,509"/>
  </g>
  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="372" y="446">สลับที่</text>
    <text x="372" y="496">ไม่บอก = void</text>
  </g>
</svg>
