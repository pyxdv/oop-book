<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">คลาสนามธรรมกับอินเทอร์เฟซ ต่างกันตรงไหน</text>
  <rect x="240" y="60" width="260" height="44" rx="8" fill="#2563eb"/>
  <text x="370" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">คลาสนามธรรม (abstract class)</text>
  <rect x="510" y="60" width="270" height="44" rx="8" fill="#059669"/>
  <text x="645" y="89" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">อินเทอร์เฟซ (interface)</text>
  <g font-size="15">
    <!-- rows: start y=112, height 56 -->
    <rect x="20" y="112" width="760" height="56" fill="#f3f4f6"/>
    <rect x="20" y="224" width="760" height="56" fill="#f3f4f6"/>
    <rect x="20" y="336" width="760" height="56" fill="#f3f4f6"/>
    <rect x="20" y="448" width="760" height="56" fill="#f3f4f6"/>

    <g font-weight="bold" fill="#1f2937">
      <text x="32" y="136">สร้างออบเจกต์</text>
      <text x="32" y="156">ด้วย new ได้ไหม</text>
      <text x="32" y="201">มีโค้ดในเมธอดได้ไหม</text>
      <text x="32" y="257">มีแอตทริบิวต์ได้ไหม</text>
      <text x="32" y="313">มีคอนสตรักเตอร์ได้ไหม</text>
      <text x="32" y="369">คลาสหนึ่งรับได้กี่ตัว</text>
      <text x="32" y="425">keyword ที่ใช้</text>
      <text x="32" y="481">ใช้เมื่อไร</text>
    </g>
    <g fill="#1f2937">
      <!-- abstract class column -->
      <text x="252" y="136" fill="#dc2626">✗ ไม่ได้</text>
      <text x="252" y="157" font-size="14" fill="#4b5563">ต้อง new คลาสลูกแทน</text>
      <text x="252" y="192" fill="#059669">✓ ได้</text>
      <text x="252" y="213" font-size="14" fill="#4b5563">มีทั้งเมธอดปกติและเมธอด abstract</text>
      <text x="252" y="248" fill="#059669">✓ ได้ทุกแบบ</text>
      <text x="252" y="269" font-size="14" fill="#4b5563">เปลี่ยนค่าได้ เป็น private ได้</text>
      <text x="252" y="304" fill="#059669">✓ ได้</text>
      <text x="252" y="325" font-size="14" fill="#4b5563">คลาสลูกเรียกผ่าน super(...)</text>
      <text x="252" y="360">extends ได้คลาสเดียว</text>
      <text x="252" y="381" font-size="14" fill="#4b5563">เพราะเป็นคลาส</text>
      <text x="252" y="416">abstract class, abstract</text>
      <text x="252" y="437" font-size="14" fill="#4b5563">คลาสลูกเขียน extends</text>
      <text x="252" y="472">เป็นชนิดเดียวกัน (is-a)</text>
      <text x="252" y="493" font-size="14" fill="#4b5563">และมีโค้ดหรือข้อมูลใช้ร่วมกัน</text>

      <!-- interface column -->
      <text x="522" y="136" fill="#dc2626">✗ ไม่ได้</text>
      <text x="522" y="157" font-size="14" fill="#4b5563">ต้อง new คลาสที่ implements แทน</text>
      <text x="522" y="192">เมธอดทั่วไปไม่มีโค้ด</text>
      <text x="522" y="213" font-size="14" fill="#4b5563">(default, static มีโค้ดได้ นอกวิชานี้)</text>
      <text x="522" y="248">มีได้แค่ค่าคงที่</text>
      <text x="522" y="269" font-size="14" fill="#4b5563">เป็น public static final ให้อัตโนมัติ</text>
      <text x="522" y="304" fill="#dc2626">✗ ไม่มี</text>
      <text x="522" y="325" font-size="14" fill="#4b5563">เพราะไม่มีแอตทริบิวต์ให้ตั้งค่า</text>
      <text x="522" y="360">implements ได้หลายตัว</text>
      <text x="522" y="381" font-size="14" fill="#4b5563">คั่นด้วยจุลภาค เช่น A, B</text>
      <text x="522" y="416">interface</text>
      <text x="522" y="437" font-size="14" fill="#4b5563">คลาสที่ทำตามเขียน implements</text>
      <text x="522" y="472">บอกความสามารถ (can-do)</text>
      <text x="522" y="493" font-size="14" fill="#4b5563">ใช้ได้กับคลาสที่ไม่เกี่ยวกันเลย</text>
    </g>
    <line x1="235" y1="112" x2="235" y2="504" stroke="#9ca3af" stroke-width="1"/>
    <line x1="505" y1="112" x2="505" y2="504" stroke="#9ca3af" stroke-width="1"/>
  </g>
  <text x="400" y="540" text-anchor="middle" font-size="14" fill="#4b5563">ทั้งสองแบบใช้เป็นชนิดของตัวแปรได้ เช่น Payment p หรือ Refundable r จึงใช้กับพหุสัณฐานได้</text>
  <text x="400" y="562" text-anchor="middle" font-size="14" fill="#4b5563">ข้อเท็จจริงตาม Java 17 และ 21</text>
</svg>
