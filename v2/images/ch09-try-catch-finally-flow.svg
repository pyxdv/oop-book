<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="เส้นทางการทำงานของ try catch finally สามกรณี ไม่เกิด exception เกิดแล้วจับได้ และเกิดแต่ไม่มี catch ตรงชนิด">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <g font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold">เส้นทางการทำงานของ try / catch / finally</text>

    <!-- A: try -->
    <rect x="170" y="62" width="260" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="91" text-anchor="middle" font-size="16"><tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">try</tspan> ทำทีละบรรทัด</text>
    <line x1="300" y1="108" x2="300" y2="136" stroke="#4b5563" stroke-width="2" marker-end="url(#aGray)"/>

    <!-- B: diamond -->
    <polygon points="300,140 435,185 300,230 165,185" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="300" y="181" text-anchor="middle" font-size="15">มีบรรทัดไหน</text>
    <text x="300" y="200" text-anchor="middle" font-size="15">โยน exception ไหม</text>

    <!-- C: diamond -->
    <polygon points="625,140 760,185 625,230 490,185" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="625" y="181" text-anchor="middle" font-size="15">มี catch ที่ชนิด</text>
    <text x="625" y="200" text-anchor="middle" font-size="15">ตรงกันไหม</text>

    <!-- B yes -> C -->
    <line x1="435" y1="185" x2="486" y2="185" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aOrange)"/>
    <text x="460" y="174" text-anchor="middle" font-size="14" fill="#d97706">มี</text>
    <text x="455" y="248" text-anchor="middle" font-size="14" fill="#4b5563">กระโดดออกจาก try ทันที</text>
    <text x="455" y="266" text-anchor="middle" font-size="14" fill="#4b5563">บรรทัดที่เหลือไม่ได้ทำ</text>

    <!-- C yes -> catch -->
    <line x1="625" y1="230" x2="625" y2="282" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aOrange)"/>
    <text x="635" y="262" font-size="14" fill="#d97706">✓ ตรง</text>
    <rect x="525" y="286" width="200" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="625" y="315" text-anchor="middle" font-size="16">ทำโค้ดใน <tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">catch</tspan></text>

    <!-- catch -> finally -->
    <path d="M625 332 V368 H434" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aOrange)"/>

    <!-- C no -> finally (red) -->
    <path d="M760 185 H780 V392 H434" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#aRed)"/>
    <text x="772" y="170" text-anchor="end" font-size="14" fill="#dc2626">✗ ไม่ตรง</text>

    <!-- B no -> finally (green) -->
    <line x1="300" y1="230" x2="300" y2="352" stroke="#059669" stroke-width="2.5" marker-end="url(#aGreen)"/>
    <text x="290" y="282" text-anchor="end" font-size="14" fill="#059669">✓ ไม่มี</text>
    <text x="290" y="300" text-anchor="end" font-size="14" fill="#059669">ข้าม catch ทุกตัว</text>

    <!-- finally -->
    <rect x="170" y="356" width="260" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="300" y="385" text-anchor="middle" font-size="16">ทำ <tspan font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">finally</tspan> (ทำเสมอ)</text>

    <!-- finally -> continue -->
    <line x1="250" y1="402" x2="250" y2="466" stroke="#4b5563" stroke-width="2" marker-end="url(#aGray)"/>
    <text x="240" y="430" text-anchor="end" font-size="14" fill="#4b5563">ไม่มี exception</text>
    <text x="240" y="448" text-anchor="end" font-size="14" fill="#4b5563">หรือจับได้แล้ว</text>
    <rect x="110" y="470" width="280" height="46" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="250" y="499" text-anchor="middle" font-size="16">✓ ทำคำสั่งถัดจาก try ต่อ</text>

    <!-- finally -> propagate -->
    <path d="M400 402 V436 H600 V466" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#aRed)"/>
    <text x="614" y="452" font-size="14" fill="#dc2626">ยังไม่มีใครจับ</text>
    <rect x="460" y="470" width="280" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="499" text-anchor="middle" font-size="16">✗ โยนต่อให้เมธอดที่เรียกมา</text>

    <!-- legend -->
    <line x1="40" y1="560" x2="80" y2="560" stroke="#059669" stroke-width="2.5"/>
    <text x="88" y="565" font-size="14">ไม่เกิด exception</text>
    <line x1="250" y1="560" x2="290" y2="560" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="298" y="565" font-size="14">เกิดแล้วจับได้</text>
    <line x1="450" y1="560" x2="490" y2="560" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="498" y="565" font-size="14">เกิดแต่ไม่มี catch ตรงชนิด</text>
  </g>
</svg>
