<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">แยกคลาสที่ทำหลายหน้าที่ ให้เหลือคลาสละหน้าที่</text>
  <text x="140" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">✗ ก่อนแยก</text>
  <rect x="30" y="92" width="220" height="250" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#1f2937">Student</text>
  <line x1="30" y1="130" x2="250" y2="130" stroke="#dc2626"/>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">
    <rect x="44" y="142" width="192" height="40" rx="6" fill="#ede9fe"/>
    <text x="54" y="160">name, gpa</text><text x="54" y="176">displayInfo()</text>
    <rect x="44" y="190" width="192" height="30" rx="6" fill="#dbeafe"/>
    <text x="54" y="210">connectToDatabase()</text>
    <rect x="44" y="228" width="192" height="30" rx="6" fill="#d1fae5"/>
    <text x="54" y="248">sendEmail()</text>
    <rect x="44" y="266" width="192" height="30" rx="6" fill="#fef3c7"/>
    <text x="54" y="286">generateReport()</text>
  </g>
  <text x="140" y="322" text-anchor="middle" font-size="14" fill="#1f2937">เหตุให้ต้องแก้ 4 เรื่อง</text>
  <path d="M262,217 L318,217" stroke="#4b5563" stroke-width="3" marker-end="url(#ar)"/>
  <text x="290" y="205" text-anchor="middle" font-size="14" fill="#4b5563">แยก</text>
  <text x="550" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#059669">✓ หลังแยก</text>
  <!-- Student center-top -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937" text-anchor="middle">
    <rect x="460" y="92" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="550" y="116" font-weight="bold">Student</text>
    <text x="550" y="138">name, gpa</text>
    <text x="550" y="154">displayInfo()</text>
    <rect x="330" y="262" width="140" height="62" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="400" y="286" font-weight="bold">Database</text>
    <text x="400" y="308">saveStudent()</text>
    <rect x="482" y="262" width="136" height="62" rx="10" fill="#d1fae5" stroke="#059669"/>
    <text x="550" y="286" font-weight="bold">EmailService</text>
    <text x="550" y="308">sendEmail()</text>
    <rect x="630" y="262" width="150" height="62" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="705" y="286" font-weight="bold">ReportGenerator</text>
    <text x="705" y="308">generate...()</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <path d="M400,262 L500,166" marker-end="url(#ar)"/>
    <path d="M705,262 L600,166" marker-end="url(#ar)"/>
  </g>
  <text x="426" y="204" text-anchor="end" font-size="14" fill="#4b5563">ใช้ Student</text>
  <text x="426" y="222" text-anchor="end" font-size="14" fill="#4b5563">ตอนบันทึก</text>
  <text x="672" y="204" font-size="14" fill="#4b5563">ใช้ Student</text>
  <text x="672" y="222" font-size="14" fill="#4b5563">ตอนออกรายงาน</text>
  <text x="550" y="354" text-anchor="middle" font-size="14" fill="#1f2937">เปลี่ยนฐานข้อมูล แก้ Database คลาสเดียว</text>
  <text x="400" y="400" text-anchor="middle" font-size="15" fill="#1f2937">สีเดียวกัน = หน้าที่เดียวกัน คลาสฝั่งขวามีเหตุให้ต้องแก้คลาสละหนึ่งเรื่อง</text>
</svg>
