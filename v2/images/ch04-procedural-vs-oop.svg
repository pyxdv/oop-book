<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ข้อมูลอยู่ตรงไหน เทียบสองแบบ</text>
  <line x1="400" y1="62" x2="400" y2="380" stroke="#9ca3af" stroke-dasharray="6 6"/>
  <!-- left -->
  <text x="200" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#d97706">แบบ Procedural</text>
  <text x="200" y="100" text-anchor="middle" font-size="14" fill="#4b5563">ตัวแปรกระจัดกระจาย ฟังก์ชันอยู่แยก</text>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">
    <rect x="30" y="122" width="160" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="110" y="147" text-anchor="middle">studentName</text>
    <rect x="30" y="178" width="160" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="110" y="203" text-anchor="middle">studentAge</text>
    <rect x="30" y="234" width="160" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="110" y="259" text-anchor="middle">studentGPA</text>
    <rect x="236" y="168" width="148" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="310" y="194" text-anchor="middle">printStudent(</text>
    <text x="310" y="214" text-anchor="middle">name,age,gpa)</text>
  </g>
  <path d="M190,142 C215,142 215,180 236,184" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M190,198 L236,198" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M190,254 C215,254 215,216 236,212" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <text x="200" y="306" text-anchor="middle" font-size="15" fill="#1f2937">ต้องส่งค่าเข้าไปเองทีละตัว</text>
  <text x="200" y="330" text-anchor="middle" font-size="15" fill="#1f2937">นักศึกษา 100 คน = ตัวแปร 300 ตัว</text>
  <text x="200" y="354" text-anchor="middle" font-size="14" fill="#dc2626">✗ ส่งผิดลำดับหรือผิดคน ก็ไม่มีใครเตือน</text>
  <!-- right -->
  <text x="600" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563eb">แบบ OOP</text>
  <text x="600" y="100" text-anchor="middle" font-size="14" fill="#4b5563">ข้อมูลกับพฤติกรรมอยู่ในก้อนเดียว</text>
  <rect x="470" y="118" width="260" height="170" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">ออบเจกต์ student</text>
  <line x1="470" y1="156" x2="730" y2="156" stroke="#2563eb"/>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">
    <text x="490" y="180">name = "สมชาย"</text>
    <text x="490" y="202">age  = 20</text>
    <text x="490" y="224">gpa  = 3.5</text>
  </g>
  <line x1="470" y1="238" x2="730" y2="238" stroke="#2563eb"/>
  <text x="490" y="268" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">displayInfo()</text>
  <text x="725" y="196" text-anchor="end" font-size="14" fill="#4b5563">ข้อมูล</text>
  <text x="725" y="268" text-anchor="end" font-size="14" fill="#4b5563">พฤติกรรม</text>
  <text x="600" y="330" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">student.displayInfo();</text>
  <line x1="600" y1="314" x2="600" y2="292" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <text x="600" y="358" text-anchor="middle" font-size="14" fill="#059669">✓ เรียกเมธอด ออบเจกต์ใช้ข้อมูลของตัวเอง</text>
</svg>
