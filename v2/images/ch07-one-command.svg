<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">สั่งคำเดียว แต่ละออบเจกต์ทำงานแบบของตัวเอง</text>
  <text x="400" y="66" text-anchor="middle" font-size="15" fill="#4b5563">เหมือนกดปุ่ม "ชำระเงิน" ที่แคชเชียร์ ไม่ว่าลูกค้าจะจ่ายด้วยวิธีไหน</text>

  <rect x="30" y="160" width="250" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="192" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">PaymentProcessor</text>
  <text x="155" y="220" text-anchor="middle" font-size="15" fill="#4b5563">รู้จักแค่ชนิด Payment</text>
  <text x="155" y="258" text-anchor="middle" font-size="15" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">p.processPayment()</text>

  <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M280,225 C340,225 360,125 428,125"/>
    <path d="M280,225 C340,225 360,205 428,205"/>
    <path d="M280,225 C340,225 360,285 428,285"/>
    <path d="M280,225 C340,225 360,365 428,365"/>
  </g>

  <g>
    <rect x="430" y="95" width="340" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="446" y="120" font-size="15" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">CreditCardPayment</text>
    <text x="446" y="144" font-size="14" fill="#4b5563">ตัดบัตร โชว์เลขบัตร 4 ตัวท้าย</text>
    <rect x="430" y="175" width="340" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="446" y="200" font-size="15" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">MobilePayment</text>
    <text x="446" y="224" font-size="14" fill="#4b5563">จ่ายผ่านแอปธนาคาร ใช้เบอร์โทรอ้างอิง</text>
    <rect x="430" y="255" width="340" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="446" y="280" font-size="15" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">QRCodePayment</text>
    <text x="446" y="304" font-size="14" fill="#4b5563">แสดงรหัส QR ให้ลูกค้าสแกน</text>
    <rect x="430" y="335" width="340" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="446" y="360" font-size="15" font-weight="bold" fill="#1f2937" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">CashPayment</text>
    <text x="446" y="384" font-size="14" fill="#4b5563">รับเงินสด ไม่ต้องใช้เลขบัตรหรือเบอร์โทร</text>
  </g>
  <text x="155" y="330" text-anchor="middle" font-size="14" fill="#4b5563">ส่งคำสั่งเดียวกันให้ทุกตัว</text>
  <text x="155" y="352" text-anchor="middle" font-size="14" fill="#4b5563">โดยไม่ต้องรู้ว่าจ่ายแบบไหน</text>
</svg>
