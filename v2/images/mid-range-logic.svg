<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1f2937">อ่านคำในโจทย์ให้ออก แล้วเลือกเครื่องหมายให้ถูก</text>
  <text x="40" y="70" font-size="15" fill="#4b5563">ช่วงที่ระบายสีคือค่า x ที่ผ่านเงื่อนไข · วงกลมทึบ = นับขอบ · วงกลมกลวง = ไม่นับขอบ</text>
  <!-- row 1 -->
  <rect x="24" y="92" width="752" height="110" rx="12" fill="#fee2e2" fill-opacity="0.45"/>
  <text x="40" y="124" font-size="18" font-weight="700" fill="#1f2937">"ระหว่าง a และ b"</text>
  <text x="40" y="150" font-size="15" fill="#4b5563">ไม่รวมขอบ (Exclusive)</text>
  <text x="40" y="180" font-size="16" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#dc2626" font-weight="700">x &gt; a &amp;&amp; x &lt; b</text>
  <line x1="340" y1="150" x2="760" y2="150" stroke="#9ca3af" stroke-width="2"/>
  <line x1="460" y1="150" x2="640" y2="150" stroke="#dc2626" stroke-width="8"/>
  <circle cx="460" cy="150" r="9" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <circle cx="640" cy="150" r="9" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="186" font-size="16" text-anchor="middle" fill="#1f2937">a</text>
  <text x="640" y="186" font-size="16" text-anchor="middle" fill="#1f2937">b</text>
  <!-- row 2 -->
  <rect x="24" y="214" width="752" height="110" rx="12" fill="#d1fae5" fill-opacity="0.45"/>
  <text x="40" y="246" font-size="18" font-weight="700" fill="#1f2937">"ตั้งแต่ a ถึง b"</text>
  <text x="40" y="272" font-size="15" fill="#4b5563">รวมขอบ (Inclusive)</text>
  <text x="40" y="302" font-size="16" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#059669" font-weight="700">x &gt;= a &amp;&amp; x &lt;= b</text>
  <line x1="340" y1="272" x2="760" y2="272" stroke="#9ca3af" stroke-width="2"/>
  <line x1="460" y1="272" x2="640" y2="272" stroke="#059669" stroke-width="8"/>
  <circle cx="460" cy="272" r="9" fill="#059669"/>
  <circle cx="640" cy="272" r="9" fill="#059669"/>
  <text x="460" y="308" font-size="16" text-anchor="middle" fill="#1f2937">a</text>
  <text x="640" y="308" font-size="16" text-anchor="middle" fill="#1f2937">b</text>
  <!-- row 3 -->
  <rect x="24" y="336" width="752" height="110" rx="12" fill="#fef3c7" fill-opacity="0.6"/>
  <text x="40" y="368" font-size="18" font-weight="700" fill="#1f2937">"นอกช่วง a ถึง b"</text>
  <text x="40" y="394" font-size="15" fill="#4b5563">ต่ำกว่า a หรือ สูงกว่า b</text>
  <text x="40" y="424" font-size="16" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#d97706" font-weight="700">x &lt; a || x &gt; b</text>
  <line x1="340" y1="394" x2="760" y2="394" stroke="#9ca3af" stroke-width="2"/>
  <line x1="340" y1="394" x2="460" y2="394" stroke="#d97706" stroke-width="8"/>
  <line x1="640" y1="394" x2="760" y2="394" stroke="#d97706" stroke-width="8"/>
  <circle cx="460" cy="394" r="9" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <circle cx="640" cy="394" r="9" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="460" y="430" font-size="16" text-anchor="middle" fill="#1f2937">a</text>
  <text x="640" y="430" font-size="16" text-anchor="middle" fill="#1f2937">b</text>
  <text x="550" y="384" font-size="14" text-anchor="middle" fill="#4b5563">ไม่นับ</text>
</svg>
