<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" role="img" aria-label="สมาชิกแต่ละแบบของ Vehicle ที่คลาสลูก Car ใช้ได้หรือไม่">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Car extends Vehicle แล้ว Car ใช้อะไรของ Vehicle ได้บ้าง</text>

  <g font-size="15" font-weight="700" fill="#4b5563">
    <text x="40" y="82">สมาชิกใน Vehicle</text>
    <text x="370" y="82">โค้ดใน Car เรียกตรง ๆ ได้ไหม</text>
  </g>
  <line x1="30" y1="94" x2="770" y2="94" stroke="#9ca3af" stroke-width="1.5"/>

  <g font-size="15" fill="#1f2937">
    <!-- public -->
    <rect x="30" y="106" width="300" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="44" y="140" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">public String brand</text>
    <rect x="360" y="106" width="410" height="56" rx="8" fill="#d1fae5"/>
    <text x="376" y="131" fill="#059669" font-weight="700">✓ ได้</text>
    <text x="376" y="152">ใช้ได้ทุกที่ ไม่ว่าจะเป็นคลาสลูกหรือไม่</text>

    <!-- protected -->
    <rect x="30" y="174" width="300" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="44" y="208" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">protected int year</text>
    <rect x="360" y="174" width="410" height="56" rx="8" fill="#d1fae5"/>
    <text x="376" y="199" fill="#059669" font-weight="700">✓ ได้</text>
    <text x="376" y="220">คลาสลูกใช้ได้เสมอ แม้อยู่คนละแพ็กเกจ</text>

    <!-- default -->
    <rect x="30" y="242" width="300" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="44" y="276" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">String model</text>
    <text x="180" y="276" font-size="14" fill="#4b5563">(ไม่ใส่ modifier)</text>
    <rect x="360" y="242" width="410" height="56" rx="8" fill="#fef3c7"/>
    <text x="376" y="267" fill="#d97706" font-weight="700">✓ / ✗ แล้วแต่แพ็กเกจ</text>
    <text x="376" y="288">แพ็กเกจเดียวกันได้ ต่างแพ็กเกจคอมไพล์ไม่ผ่าน</text>

    <!-- private -->
    <rect x="30" y="310" width="300" height="76" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="44" y="344" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">private double price</text>
    <text x="44" y="370" font-size="14" fill="#4b5563">+ public getPrice()</text>
    <rect x="360" y="310" width="410" height="76" rx="8" fill="#fee2e2"/>
    <text x="376" y="335" fill="#dc2626" font-weight="700">✗ เรียกตรง ๆ ไม่ได้</text>
    <text x="376" y="356">แต่ค่า price ยังอยู่ในออบเจกต์ Car ทุกตัว</text>
    <text x="376" y="377">อ่านผ่านเมธอดที่ไม่ใช่ private เช่น getPrice()</text>

    <!-- constructor -->
    <rect x="30" y="398" width="300" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="44" y="430" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Vehicle(...)</text>
    <text x="44" y="456" font-size="14" fill="#4b5563">คอนสตรักเตอร์</text>
    <rect x="360" y="398" width="410" height="76" rx="8" fill="#fee2e2"/>
    <text x="376" y="423" fill="#dc2626" font-weight="700">✗ ไม่สืบทอด</text>
    <text x="376" y="444">เขียน new Car(...) ด้วยรูปแบบของ Vehicle ไม่ได้</text>
    <text x="376" y="465">เรียกได้ทางเดียวคือ super(...) ในคอนสตรักเตอร์ของ Car</text>
  </g>
  <text x="400" y="504" text-anchor="middle" font-size="15" fill="#4b5563">ข้อ default และ protected ตรวจกับ javac จริงโดยแยก Vehicle และ Car ไว้คนละแพ็กเกจ</text>
</svg>
