<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 780 420" width="780" height="420" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="24" y="40" font-size="22" font-weight="bold" fill="#1f2937">วงจร refactor: เทสต์ แก้ทีละนิด เทสต์อีกรอบ</text>
<text x="24" y="66" font-size="15" fill="#4b5563">กติกาเดียว: ผลลัพธ์ที่ผู้ใช้เห็นต้องเหมือนเดิมทุกครั้ง</text>
<rect x="24" y="170" width="140" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="94.0" y="203.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">1. รันเทสต์</text>
<text x="94.0" y="225.0" font-size="14" text-anchor="middle" fill="#1f2937">ต้องผ่านหมดก่อน</text>
<rect x="204" y="170" width="150" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="279.0" y="192.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">2. แก้ทีละนิด</text>
<text x="279.0" y="214.0" font-size="14" text-anchor="middle" fill="#1f2937">rename / extract</text>
<text x="279.0" y="236.0" font-size="14" text-anchor="middle" fill="#1f2937">/ แทนตัวเลขโดด</text>
<rect x="394" y="170" width="150" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="469.0" y="203.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">3. คอมไพล์</text>
<text x="469.0" y="225.0" font-size="14" text-anchor="middle" fill="#1f2937">แล้วรันเทสต์อีกรอบ</text>
<polygon points="640,160.0 702,208.0 640,256.0 578,208.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="640" y="214.0" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">ผ่านไหม</text>
<polyline points="164,208.0 202,208.0" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="354,208.0 392,208.0" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="544,208.0 576,208.0" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="640,160.0 640,104 279,104 279,168" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah)"/>
<text x="460" y="96" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold">✓ ผ่าน: เก็บงาน แล้วแก้ขั้นต่อไป</text>
<rect x="560" y="318" width="160" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="640.0" y="341.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">ย้อนการแก้ล่าสุด</text>
<text x="640.0" y="363.0" font-size="14" text-anchor="middle" fill="#1f2937">(undo)</text>
<polyline points="640,256.0 640,316" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
<text x="650" y="296" font-size="15" fill="#dc2626" font-weight="bold">✗ ไม่ผ่าน</text>
<polyline points="560,346 279,346 279,248" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
<text x="420" y="338" font-size="14" text-anchor="middle" fill="#4b5563">ลองแก้ให้เล็กลงกว่าเดิม</text>
<text x="24" y="404" font-size="14" fill="#4b5563">ในบทนี้ RefactorCheck.java คือเทสต์ของเรา มันพิมพ์ PASS เมื่อใบเสร็จแบบใหม่ตรงกับแบบเดิมทุกตัวอักษร</text>
</svg>