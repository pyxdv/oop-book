<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">แผนภาพคลาสของร้านค้าออนไลน์ (ClassDiagramExample.java)</text>

  <!-- กรอบคลาส -->
  <g fill="#ffffff" stroke="#1f2937" stroke-width="2">
    <rect x="250" y="60" width="300" height="222"/>
    <rect x="30" y="340" width="270" height="134"/>
    <rect x="430" y="340" width="340" height="134"/>
    <rect x="30" y="530" width="290" height="204"/>
    <rect x="466" y="530" width="304" height="226"/>
    <rect x="250" y="810" width="270" height="132"/>
  </g>
  <g fill="#dbeafe">
    <rect x="251" y="61" width="298" height="51"/>
    <rect x="31" y="341" width="268" height="37"/>
    <rect x="431" y="341" width="338" height="37"/>
    <rect x="31" y="531" width="288" height="37"/>
    <rect x="467" y="531" width="302" height="37"/>
    <rect x="251" y="811" width="268" height="37"/>
  </g>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="250" y1="112" x2="550" y2="112"/><line x1="250" y1="172" x2="550" y2="172"/>
    <line x1="30" y1="378" x2="300" y2="378"/><line x1="30" y1="414" x2="300" y2="414"/>
    <line x1="430" y1="378" x2="770" y2="378"/><line x1="430" y1="414" x2="770" y2="414"/>
    <line x1="30" y1="568" x2="320" y2="568"/><line x1="30" y1="648" x2="320" y2="648"/>
    <line x1="466" y1="568" x2="770" y2="568"/><line x1="466" y1="672" x2="770" y2="672"/>
    <line x1="250" y1="848" x2="520" y2="848"/><line x1="250" y1="904" x2="520" y2="904"/>
  </g>

  <!-- ชื่อคลาส -->
  <g font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="400" y="86" font-style="italic">Person</text>
    <text x="165" y="365">Customer</text>
    <text x="600" y="365">Admin</text>
    <text x="175" y="555">Order</text>
    <text x="618" y="555">Product</text>
    <text x="385" y="835">OrderItem</text>
  </g>
  <text x="400" y="106" text-anchor="middle" font-size="14" fill="#4b5563">{abstract}</text>

  <!-- สมาชิกของคลาส -->
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#1f2937">
    <text x="262" y="136"># name : String</text>
    <text x="262" y="160"># email : String</text>
    <text x="262" y="196">+ getName() : String</text>
    <text x="262" y="220">+ setName(name : String)</text>
    <text x="262" y="244">+ getEmail() : String</text>
    <text x="262" y="268" font-style="italic">+ displayInfo() : void</text>

    <text x="42" y="402">- address : String</text>
    <text x="42" y="438">+ placeOrder() : Order</text>
    <text x="42" y="462">+ displayInfo() : void</text>

    <text x="442" y="402">- role : String</text>
    <text x="442" y="438">+ manageProducts(p : Product, n : int)</text>
    <text x="442" y="462">+ displayInfo() : void</text>

    <text x="42" y="592">- orderId : String</text>
    <text x="42" y="616">- orderDate : Date</text>
    <text x="42" y="640">- totalAmount : double</text>
    <text x="42" y="672">+ addItem(p : Product, q : int)</text>
    <text x="42" y="696">+ calculateTotal() : void</text>
    <text x="42" y="720">+ getTotalAmount() : double</text>

    <text x="478" y="592">- productId : String</text>
    <text x="478" y="616">- name : String</text>
    <text x="478" y="640">- price : double</text>
    <text x="478" y="664">- stock : int</text>
    <text x="478" y="696">+ getPrice() : double</text>
    <text x="478" y="720">+ updateStock(n : int)</text>
    <text x="478" y="744">+ reduceStock(q : int) : boolean</text>

    <text x="262" y="872">- quantity : int</text>
    <text x="262" y="896">- price : double</text>
    <text x="262" y="928">+ getSubtotal() : double</text>
  </g>

  <!-- Inheritance: Customer, Admin -> Person -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <line x1="400" y1="300" x2="400" y2="316"/>
    <line x1="165" y1="316" x2="600" y2="316"/>
    <line x1="165" y1="316" x2="165" y2="340"/>
    <line x1="600" y1="316" x2="600" y2="340"/>
  </g>
  <polygon points="400,282 390,300 410,300" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>

  <!-- Association: Customer 1 places 0..* Order -->
  <line x1="165" y1="474" x2="165" y2="530" stroke="#1f2937" stroke-width="2"/>
  <g font-size="16" font-weight="bold">
    <text x="156" y="494" text-anchor="end" fill="#2563eb">1</text>
    <text x="156" y="524" text-anchor="end" fill="#d97706">0..*</text>
  </g>
  <text x="176" y="508" font-size="15" fill="#4b5563">places ▾</text>

  <!-- Composition: Order ◆── 0..* OrderItem -->
  <polygon points="120,734 128,746 120,758 112,746" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/>
  <polyline points="120,758 120,876 250,876" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="130" y="780" font-size="16" font-weight="bold" fill="#2563eb">1</text>
  <text x="242" y="866" text-anchor="end" font-size="16" font-weight="bold" fill="#d97706">0..*</text>
  <text x="185" y="898" text-anchor="middle" font-size="15" fill="#4b5563">contains</text>

  <!-- Association (นำทางทางเดียว): OrderItem 0..* ──> 1 Product -->
  <polyline points="520,876 630,876 630,757" fill="none" stroke="#1f2937" stroke-width="2"/>
  <polyline points="623,770 630,757 637,770" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="528" y="866" font-size="16" font-weight="bold" fill="#d97706">0..*</text>
  <text x="642" y="780" font-size="16" font-weight="bold" fill="#2563eb">1</text>
  <text x="642" y="826" font-size="15" fill="#4b5563">refers to</text>

  <!-- Dependency: Admin - - -> Product -->
  <line x1="630" y1="474" x2="630" y2="528" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4"/>
  <polyline points="623,516 630,529 637,516" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="642" y="506" font-size="15" fill="#4b5563">«use»</text>

  <!-- หมายเหตุ -->
  <text x="30" y="978" font-size="15" fill="#4b5563">ชื่อตัวเอียง = คลาสนามธรรม / เมธอดนามธรรม<tspan dx="24"># = protected</tspan></text>
</svg>
