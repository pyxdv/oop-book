<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">หลัก 4 ข้อของ OOP และบทที่สอน</text>
  <rect x="300" y="58" width="200" height="44" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="400" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">OOP</text>
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M400,102 L400,122 M110,122 L690,122 M110,122 L110,142 M303,122 L303,142 M497,122 L497,142 M690,122 L690,142"/>
  </g>
  <!-- boxes 180 wide, centers 110, 303, 497, 690 -->
  <rect x="22" y="142" width="176" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <rect x="215" y="142" width="176" height="150" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="409" y="142" width="176" height="150" rx="12" fill="#d1fae5" stroke="#059669"/>
  <rect x="602" y="142" width="176" height="150" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <g text-anchor="middle" fill="#1f2937">
    <text x="110" y="172" font-size="17" font-weight="bold">Abstraction</text>
    <text x="110" y="194" font-size="14" fill="#4b5563">(การดึงเฉพาะสาระสำคัญ)</text>
    <text x="110" y="226" font-size="15">เก็บเฉพาะที่ระบบใช้</text>
    <text x="110" y="248" font-size="15">ซ่อนขั้นตอนยุ่งยาก</text>
    <text x="110" y="280" font-size="15" font-weight="bold" fill="#7c3aed">บทที่ 4 (บทนี้)</text>
    <text x="303" y="172" font-size="17" font-weight="bold">Encapsulation</text>
    <text x="303" y="194" font-size="14" fill="#4b5563">(การห่อหุ้ม)</text>
    <text x="303" y="226" font-size="15">ปิดข้อมูลไว้ข้างใน</text>
    <text x="303" y="248" font-size="15">ให้แก้ผ่านเมธอด</text>
    <text x="303" y="280" font-size="15" font-weight="bold" fill="#2563eb">บทที่ 5</text>
    <text x="497" y="172" font-size="17" font-weight="bold">Inheritance</text>
    <text x="497" y="194" font-size="14" fill="#4b5563">(การสืบทอด)</text>
    <text x="497" y="226" font-size="15">คลาสลูกรับของ</text>
    <text x="497" y="248" font-size="15">จากคลาสแม่</text>
    <text x="497" y="280" font-size="15" font-weight="bold" fill="#059669">บทที่ 6</text>
    <text x="690" y="172" font-size="17" font-weight="bold">Polymorphism</text>
    <text x="690" y="194" font-size="14" fill="#4b5563">(พหุสัณฐาน)</text>
    <text x="690" y="226" font-size="15">เรียกเมธอดชื่อเดียว</text>
    <text x="690" y="248" font-size="15">ได้ผลตามชนิดจริง</text>
    <text x="690" y="280" font-size="15" font-weight="bold" fill="#d97706">บทที่ 7</text>
  </g>
  <text x="400" y="324" text-anchor="middle" font-size="14" fill="#4b5563">ทั้ง 4 ข้อทำงานร่วมกัน แต่เราจะเรียนทีละข้อตามลำดับบท</text>
</svg>
