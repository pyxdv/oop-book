<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-label="Dynamic binding: ตัวแปรชนิด Animal อ้างถึงออบเจกต์ Cat เมื่อเรียก makeSound ตอนรัน Java ใช้เมธอดของ Cat จึงพิมพ์ Meow" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="390.0" y="40" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="bold">ตัวแปรเป็นชนิด Animal แต่เมธอดที่รันมาจากออบเจกต์จริง</text>
<rect x="24" y="70" width="732" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="44" y="99" font-size="16" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Animal myPet = new Cat();   myPet.makeSound();</text>
<rect x="40" y="160" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="140" y="192" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">ตัวแปร myPet</text>
<text x="140" y="218" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="normal">ชนิดที่ประกาศ: Animal</text>
<rect x="330" y="150" width="200" height="100" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="430" y="182" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">ออบเจกต์ Cat</text>
<text x="430" y="208" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="normal">สร้างด้วย new Cat()</text>
<text x="430" y="232" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">makeSound() → "Meow"</text>
<line x1="240" y1="200" x2="326" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
<text x="283" y="190" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="normal">อ้างถึง</text>
<rect x="600" y="160" width="156" height="80" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<text x="678" y="192" font-size="15" fill="#4b5563" text-anchor="middle" font-weight="normal">พิมพ์ออกมา</text>
<text x="678" y="220" font-size="18" fill="#059669" text-anchor="middle" font-weight="bold" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Meow</text>
<line x1="530" y1="200" x2="596" y2="200" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="280" width="716" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="60" y="310" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal">ตอนคอมไพล์: Java เช็กว่า Animal มีเมธอด makeSound() ไหม (มี จึงคอมไพล์ผ่าน)</text>
<text x="60" y="338" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal">ตอนรัน: Java ดูออบเจกต์จริงว่าเป็น Cat แล้วเรียก makeSound() ของ Cat</text>
</svg>
