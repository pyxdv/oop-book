<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-label="อาร์เรย์ numbers ยาว 3 ช่อง index ที่ใช้ได้คือ 0 ถึง 2 ถ้าเรียก numbers[3] หรือ numbers[-1] จะเกิด ArrayIndexOutOfBoundsException">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="ob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g style="font-variant-ligatures:none" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" fill="#1f2937">
    <text x="390" y="36" font-size="22" font-weight="bold" text-anchor="middle">ขอช่องที่ไม่มีอยู่จริง โปรแกรมหยุดทันที</text>
    <text x="390" y="64" font-size="16" text-anchor="middle" fill="#4b5563" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">int[] numbers = {10, 20, 30};   // length = 3</text>

    <g font-size="15" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="185" y="102" fill="#dc2626">[-1]</text>
      <text x="290" y="102">[0]</text><text x="390" y="102">[1]</text><text x="490" y="102">[2]</text>
      <text x="595" y="102" fill="#dc2626">[3]</text>
    </g>
    <rect x="140" y="112" width="90" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="245" y="112" width="290" height="60" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <line x1="342" y1="112" x2="342" y2="172" stroke="#059669" stroke-width="2"/>
    <line x1="438" y1="112" x2="438" y2="172" stroke="#059669" stroke-width="2"/>
    <rect x="550" y="112" width="90" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <g font-size="22" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">
      <text x="293" y="150">10</text><text x="390" y="150">20</text><text x="487" y="150">30</text>
    </g>
    <text x="185" y="140" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>
    <text x="595" y="140" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="bold">✗</text>

    <path d="M245,186 L245,196 L535,196 L535,186" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="390" y="220" font-size="15" text-anchor="middle" fill="#065f46">✓ ใช้ได้เฉพาะ 0 ถึง length - 1 (คือ 0 ถึง 2)</text>
    <text x="185" y="162" font-size="14" text-anchor="middle" fill="#dc2626">ไม่มีช่องนี้</text>
    <text x="595" y="162" font-size="14" text-anchor="middle" fill="#dc2626">ไม่มีช่องนี้</text>

    <!-- error -->
    <text x="40" y="262" font-size="16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="bold">System.out.println(numbers[3]);</text>
    <path d="M370,256 C520,256 595,230 595,180" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ob)"/>
    <rect x="40" y="280" width="700" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="56" y="303" font-size="14" fill="#991b1b" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException:</text>
    <text x="56" y="325" font-size="14" fill="#991b1b" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Index 3 out of bounds for length 3</text>
  </g>
</svg>
