<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">แผนภาพคลาสของระบบยืม-คืนหนังสือ</text>

  <g fill="#ffffff" stroke="#1f2937" stroke-width="2">
    <rect x="30" y="80" width="270" height="134"/>
    <rect x="470" y="80" width="280" height="182"/>
    <rect x="470" y="360" width="280" height="158"/>
  </g>
  <g fill="#dbeafe">
    <rect x="31" y="81" width="268" height="37"/>
    <rect x="471" y="81" width="278" height="37"/>
    <rect x="471" y="361" width="278" height="37"/>
  </g>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="30" y1="118" x2="300" y2="118"/><line x1="30" y1="178" x2="300" y2="178"/>
    <line x1="470" y1="118" x2="750" y2="118"/><line x1="470" y1="226" x2="750" y2="226"/>
    <line x1="470" y1="398" x2="750" y2="398"/><line x1="470" y1="482" x2="750" y2="482"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="165" y="106">Member</text>
    <text x="610" y="106">Loan</text>
    <text x="610" y="386">Book</text>
  </g>
  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#1f2937">
    <text x="42" y="142">- memberId : String</text>
    <text x="42" y="166">- name : String</text>
    <text x="42" y="202">+ borrow(...) : Loan</text>

    <text x="482" y="142">- loanId : String</text>
    <text x="482" y="166">- loanDate : LocalDate</text>
    <text x="482" y="190">- dueDate : LocalDate</text>
    <text x="482" y="214">- returned : boolean</text>
    <text x="482" y="250">+ returnBook() : void</text>

    <text x="482" y="422">- isbn : String</text>
    <text x="482" y="446">- title : String</text>
    <text x="482" y="470">- author : String</text>
    <text x="482" y="506">+ getInfo() : String</text>
  </g>

  <!-- Member 1 ── 0..* Loan -->
  <line x1="300" y1="99" x2="470" y2="99" stroke="#1f2937" stroke-width="2"/>
  <text x="308" y="91" font-size="18" font-weight="bold" fill="#2563eb">1</text>
  <text x="462" y="91" text-anchor="end" font-size="18" font-weight="bold" fill="#d97706">0..*</text>
  <text x="385" y="124" text-anchor="middle" font-size="16" fill="#4b5563">makes ▸</text>

  <!-- Loan 0..* ── 1 Book -->
  <line x1="610" y1="262" x2="610" y2="360" stroke="#1f2937" stroke-width="2"/>
  <text x="620" y="284" font-size="18" font-weight="bold" fill="#d97706">0..*</text>
  <text x="620" y="352" font-size="18" font-weight="bold" fill="#2563eb">1</text>
  <text x="620" y="318" font-size="16" fill="#4b5563">refers to ▾</text>

  <!-- วิธีอ่าน -->
  <text x="30" y="270" font-size="17" font-weight="bold" fill="#1f2937">อ่านแผนภาพนี้ได้ว่า</text>
  <g font-size="15" fill="#1f2937">
    <text x="30" y="300">• สมาชิก 1 คน มีใบยืมได้ 0 ถึงหลายใบ</text>
    <text x="30" y="326">• ใบยืม 1 ใบ เป็นของสมาชิก 1 คน</text>
    <text x="30" y="352">• ใบยืม 1 ใบ อ้างถึงหนังสือ 1 เล่ม</text>
    <text x="30" y="378">• หนังสือ 1 เล่ม มีประวัติการยืมได้หลายใบ</text>
  </g>
  <rect x="30" y="420" width="400" height="64" rx="10" fill="#fee2e2"/>
  <text x="46" y="447" font-size="15" fill="#1f2937">✗ ห้ามตั้งชื่อเมธอดว่า return() เพราะเป็น keyword</text>
  <text x="46" y="471" font-size="15" fill="#1f2937">✓ จึงใช้ returnBook() แทน</text>
</svg>
