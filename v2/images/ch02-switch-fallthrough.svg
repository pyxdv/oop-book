<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 780 560" width="780" height="560" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <text x="390" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">switch (size) เมื่อ size = 2</text>
  <text x="200" y="74" text-anchor="middle" font-size="18" font-weight="bold" fill="#059669">✓ มี break ทุก case</text>
  <text x="590" y="74" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">✗ ลืม break (fall-through)</text>
  <line x1="390" y1="56" x2="390" y2="500" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT column -->
  <g font-size="15" fill="#1f2937">
    <rect x="40" y="96" width="250" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="56" y="124"><tspan font-family="'JetBrains Mono', Consolas, monospace">case 1</tspan>  แก้วเล็ก</text>
    <text x="300" y="124" font-size="14" fill="#4b5563">ข้าม</text>
    <rect x="40" y="156" width="250" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="56" y="184"><tspan font-family="'JetBrains Mono', Consolas, monospace">case 2</tspan>  แก้วกลาง <tspan font-family="'JetBrains Mono', Consolas, monospace" font-weight="bold" fill="#2563eb">break</tspan></text>
    <rect x="40" y="216" width="250" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="56" y="244"><tspan font-family="'JetBrains Mono', Consolas, monospace">case 3</tspan>  แก้วใหญ่</text>
    <rect x="40" y="276" width="250" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="56" y="304"><tspan font-family="'JetBrains Mono', Consolas, monospace">default</tspan>  ไม่มีขนาดนี้</text>
  </g>
  <text x="18" y="184" font-size="22" fill="#2563eb">→</text>
  <polyline points="290,178 340,178 340,362 200,362 200,376" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
  <text x="348" y="270" font-size="14" fill="#2563eb" transform="rotate(90 348 270)" text-anchor="middle">break กระโดดออก</text>
  <rect x="80" y="380" width="240" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="200" y="406" text-anchor="middle" font-size="15" fill="#1f2937">ออกจาก switch</text>
  <rect x="40" y="436" width="320" height="64" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="56" y="460" font-size="14" fill="#4b5563">ผลลัพธ์</text>
  <text x="56" y="486" font-size="15" fill="#1f2937">แก้วกลาง</text>

  <!-- RIGHT column -->
  <g font-size="15" fill="#1f2937">
    <rect x="430" y="96" width="250" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="446" y="124"><tspan font-family="'JetBrains Mono', Consolas, monospace">case 1</tspan>  แก้วเล็ก</text>
    <text x="690" y="124" font-size="14" fill="#4b5563">ข้าม</text>
    <rect x="430" y="156" width="250" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="446" y="184"><tspan font-family="'JetBrains Mono', Consolas, monospace">case 2</tspan>  แก้วกลาง</text>
    <rect x="430" y="216" width="250" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="446" y="244"><tspan font-family="'JetBrains Mono', Consolas, monospace">case 3</tspan>  แก้วใหญ่</text>
    <rect x="430" y="276" width="250" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="446" y="304"><tspan font-family="'JetBrains Mono', Consolas, monospace">default</tspan>  ไม่มีขนาดนี้</text>
  </g>
  <text x="408" y="184" font-size="22" fill="#d97706">→</text>
  <g stroke="#d97706" stroke-width="3">
    <line x1="700" y1="178" x2="700" y2="232" marker-end="url(#ao)"/>
    <line x1="700" y1="238" x2="700" y2="292" marker-end="url(#ao)"/>
  </g>
  <text x="712" y="210" font-size="14" fill="#d97706">ไหลต่อ</text>
  <text x="712" y="270" font-size="14" fill="#d97706">ไหลต่อ</text>
  <line x1="590" y1="320" x2="590" y2="374" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/>
  <rect x="470" y="380" width="240" height="40" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="590" y="406" text-anchor="middle" font-size="15" fill="#1f2937">ออกจาก switch (สุดบล็อก)</text>
  <rect x="430" y="436" width="320" height="108" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="446" y="460" font-size="14" fill="#4b5563">ผลลัพธ์</text>
  <text x="446" y="484" font-size="15" fill="#1f2937">แก้วกลาง</text>
  <text x="446" y="504" font-size="15" fill="#1f2937">แก้วใหญ่</text>
  <text x="446" y="524" font-size="15" fill="#1f2937">ไม่มีขนาดนี้</text>
  <text x="590" y="514" font-size="14" fill="#dc2626">✗ เกินมา 2 บรรทัด</text>
</svg>
