<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 760 388" width="760" height="388" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e293b" flood-opacity=".14"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff"/>
<text x="380" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">แตก branch ทำงานแยก แล้ว merge กลับ</text><text x="40" y="135" font-size="15" font-weight="bold" fill="#0369a1" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">main</text><text x="40" y="255" font-size="13" font-weight="bold" fill="#7c3aed" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">feature/</text><text x="40" y="272" font-size="13" font-weight="bold" fill="#7c3aed" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">parallel</text><path d="M150 130 L690 130" stroke="#0284c7" stroke-width="4" fill="none"/><path d="M150 130 C 210 130, 210 250, 270 250 L520 250 C 580 250, 580 130, 620 130" stroke="#7c3aed" stroke-width="4" fill="none"/><g filter="url(#sh)"><circle cx="150" cy="130" r="13" fill="#ffffff" stroke="#0284c7" stroke-width="4"/></g><text x="150" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0284c7" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">a68254c</text><text x="150" y="113" text-anchor="middle" font-size="12.5" fill="#334155">เพิ่ม Resistor</text><g filter="url(#sh)"><circle cx="400" cy="130" r="13" fill="#ffffff" stroke="#0284c7" stroke-width="4"/></g><text x="400" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0284c7" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">2a22fb2</text><text x="400" y="113" text-anchor="middle" font-size="12.5" fill="#334155">ปรับ toString (ใส่ Ω)</text><g filter="url(#sh)"><circle cx="300" cy="250" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/></g><text x="300" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c3aed" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">8b9efd6</text><text x="300" y="311" text-anchor="middle" font-size="12.5" fill="#334155">เพิ่มวงจรขนาน</text><g filter="url(#sh)"><circle cx="470" cy="250" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/></g><text x="470" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7c3aed" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">12bccf4</text><text x="470" y="311" text-anchor="middle" font-size="12.5" fill="#334155">toString ใช้คำว่า ohm</text><g filter="url(#sh)"><circle cx="620" cy="130" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="3"/></g><text x="620" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0284c7" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">b6e7ad6</text><text x="620" y="109" text-anchor="middle" font-size="12.5" fill="#334155">merge</text><path d="M436 134 Q 520 190 604 138" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M488 244 Q 560 180 610 144" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="502" y="170" width="150" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="577" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">CONFLICT</text><text x="577" y="207" text-anchor="middle" font-size="12" fill="#7f1d1d">สอง branch แก้บรรทัดเดียวกัน</text><text x="380" y="340" text-anchor="middle" font-size="13" fill="#475569" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">git switch -c feature/parallel  →  commit  →  git switch main  →  git merge feature/parallel</text><text x="380" y="366" text-anchor="middle" font-size="12.5" fill="#64748b">รหัส commit บนเครื่องของเราจะไม่ตรงกับภาพนี้ เพราะคำนวณจากเนื้อหา ชื่อคน commit และเวลา</text>
</svg>
