<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif" role="img" aria-label="ทดสอบความสัมพันธ์ is-a ด้วยประโยค A เป็น B ชนิดหนึ่ง ก่อนใช้ extends">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">ทดสอบ is-a ก่อนเขียน extends</text>

  <!-- question -->
  <rect x="220" y="58" width="360" height="48" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="17" fill="#1f2937">อ่านออกเสียง: “A เป็น B ชนิดหนึ่ง” ฟังขึ้นไหม</text>

  <line x1="300" y1="106" x2="200" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="106" x2="600" y2="140" stroke="#4b5563" stroke-width="2" marker-end="url(#ar)"/>
  <text x="222" y="126" font-size="15" fill="#4b5563" text-anchor="end">ขึ้น</text>
  <text x="578" y="126" font-size="15" fill="#4b5563">ไม่ขึ้น</text>

  <rect x="40" y="144" width="320" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="200" y="171" text-anchor="middle" font-size="16" fill="#1f2937">✓ is-a ใช้การสืบทอดได้</text>
  <text x="200" y="195" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" fill="#059669">class A extends B</text>

  <rect x="440" y="144" width="320" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="171" text-anchor="middle" font-size="16" fill="#1f2937">✗ ลองพูดว่า “A มี B” แทน</text>
  <text x="600" y="195" text-anchor="middle" font-size="15" fill="#1f2937">ถ้าขึ้น ให้ A มีแอตทริบิวต์ชนิด B (has-a)</text>

  <!-- table header -->
  <g font-size="15" font-weight="700" fill="#4b5563">
    <text x="40" y="250">คู่คลาส (A → B)</text>
    <text x="250" y="250">ลองอ่าน</text>
    <text x="580" y="250">ผล</text>
  </g>
  <line x1="30" y1="260" x2="770" y2="260" stroke="#9ca3af" stroke-width="1.5"/>

  <g font-size="15" fill="#1f2937">
    <!-- row 1 -->
    <text x="40" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Dog → Animal</text>
    <text x="250" y="290">สุนัขเป็นสัตว์ชนิดหนึ่ง</text>
    <rect x="574" y="272" width="196" height="28" rx="6" fill="#d1fae5"/>
    <text x="584" y="291" fill="#059669">✓ is-a ใช้ extends</text>
    <line x1="30" y1="314" x2="770" y2="314" stroke="#e5e7eb"/>
    <!-- row 2 -->
    <text x="40" y="344" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Manager → Employee</text>
    <text x="250" y="344">ผู้จัดการเป็นพนักงานคนหนึ่ง</text>
    <rect x="574" y="326" width="196" height="28" rx="6" fill="#d1fae5"/>
    <text x="584" y="345" fill="#059669">✓ is-a ใช้ extends</text>
    <line x1="30" y1="368" x2="770" y2="368" stroke="#e5e7eb"/>
    <!-- row 3 -->
    <text x="40" y="398" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Car → Animal</text>
    <text x="250" y="398">รถยนต์เป็นสัตว์ชนิดหนึ่ง (ไม่ใช่)</text>
    <rect x="574" y="380" width="196" height="28" rx="6" fill="#fee2e2"/>
    <text x="584" y="399" fill="#dc2626">✗ ไม่เกี่ยวกันเลย</text>
    <line x1="30" y1="422" x2="770" y2="422" stroke="#e5e7eb"/>
    <!-- row 4 -->
    <text x="40" y="452" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Car → Engine</text>
    <text x="250" y="444">รถยนต์เป็นเครื่องยนต์ (ไม่ใช่)</text>
    <text x="250" y="466" fill="#4b5563">แต่ “รถยนต์มีเครื่องยนต์” ฟังขึ้น</text>
    <rect x="574" y="438" width="196" height="28" rx="6" fill="#fef3c7"/>
    <text x="584" y="457" fill="#d97706">✗ is-a  → ใช้ has-a</text>
    <line x1="30" y1="482" x2="770" y2="482" stroke="#e5e7eb"/>
    <!-- row 5 -->
    <text x="40" y="512" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">Stack → ArrayList</text>
    <text x="250" y="504">กองจานเป็นลิสต์ (ไม่ใช่)</text>
    <text x="250" y="526" fill="#4b5563">แต่ “กองจานใช้ลิสต์เก็บจาน” ฟังขึ้น</text>
    <rect x="574" y="498" width="196" height="28" rx="6" fill="#fef3c7"/>
    <text x="584" y="517" fill="#d97706">✗ is-a  → ใช้ has-a</text>
    <line x1="30" y1="542" x2="770" y2="542" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
  <text x="400" y="574" text-anchor="middle" font-size="15" fill="#4b5563">ลูกศร A → B อ่านว่า “A เป็น B” ทิศเดียว สลับไม่ได้ (สัตว์ทุกตัวไม่ได้เป็นสุนัข)</text>
</svg>
