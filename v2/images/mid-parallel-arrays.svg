<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Sarabun, 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Loma, sans-serif">
  <rect width="100%" height="100%" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1f2937">checkStock: เทียบ 2 อาร์เรย์ทีละตำแหน่ง i</text>
  <text x="40" y="70" font-size="15" fill="#4b5563">ข้อมูลจากโค้ดตัวอย่างในบทนี้ (ผลรันจริง [7, 0, -1, -1])</text>
  <g font-size="15" fill="#4b5563" text-anchor="middle">
    <text x="275" y="104">i = 0</text><text x="405" y="104">i = 1</text><text x="535" y="104">i = 2</text><text x="665" y="104">i = 3</text>
  </g>
  <g font-size="17" font-weight="700" fill="#1f2937">
