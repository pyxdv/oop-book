    <text x="275" y="294" fill="#4b5563">10-3</text><text x="405" y="294" fill="#4b5563">5-5</text><text x="535" y="294" fill="#4b5563">ของขาด</text><text x="665" y="294" fill="#4b5563">ของขาด</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="275" y1="302" x2="275" y2="328"/><line x1="405" y1="302" x2="405" y2="328"/><line x1="535" y1="302" x2="535" y2="328"/><line x1="665" y1="302" x2="665" y2="328"/>
