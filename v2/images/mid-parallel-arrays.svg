    <text x="275" y="218">3</text><text x="405" y="218">5</text><text x="535" y="218">12</text><text x="665" y="218">1</text>
  </g>
  <g font-size="15" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" text-anchor="middle">
