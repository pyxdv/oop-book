    <text x="40" y="218" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">order</text>
    <text x="40" y="282">ตรวจ</text>
    <text x="40" y="362" style="font-variant-ligatures:none" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace">remaining</text>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
