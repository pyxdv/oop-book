    <text x="275" y="362">7</text><text x="405" y="362">0</text><text x="535" y="362">-1</text><text x="665" y="362">-1</text>
  </g>
  <text x="40" y="420" font-size="15" fill="#4b5563">ใช้ index i ตัวเดียวกันอ่านทั้งสองแถว แล้วเขียนผลลงช่อง i ของอาร์เรย์ใหม่</text>
